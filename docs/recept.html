<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1A18">
  <meta property="og:title" content="Recept">
  <meta property="og:description" content="">
  <meta property="og:type" content="article">
  <meta property="og:image" content="">
  <title>Recept</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" title="Wissel thema">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <nav class="bottom-tab-bar" id="bottom-tab-bar">
    <a href="./index.html" class="tab-bar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10a1 1 0 0 1 .4-.8l7-5.25a1 1 0 0 1 1.2 0l7 5.25a1 1 0 0 1 .4.8v9a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4h-4v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
      <span>Recepten</span>
    </a>
    <a href="./import.html" class="tab-bar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Toevoegen</span>
    </a>
  </nav>

  <div id="app" class="container"></div>

  <!-- Kookmodus overlay -->
  <div class="kookmodus-overlay" id="kookmodus-overlay" role="dialog" aria-modal="true" aria-label="Kookmodus">
    <div class="km-header">
      <span class="km-titel" id="km-recept-titel"></span>
      <button class="km-sluiten" id="km-sluiten">Sluiten</button>
    </div>
    <div class="km-voortgang" id="km-voortgang"></div>
    <div class="km-teller" id="km-teller"></div>
    <div class="km-inhoud">
      <p class="km-stap-tekst" id="km-stap-tekst"></p>
    </div>
    <div class="km-timer-blok" id="km-timer-blok"></div>
    <div class="km-nav">
      <button class="km-nav-btn km-nav-btn--vorige" id="km-vorige">Vorige</button>
      <button class="km-nav-btn km-nav-btn--volgende" id="km-volgende">Volgende</button>
    </div>
  </div>

  <script>
    let recept = null;
    let huidigPorties = 1;
    let basisPorties = 1;
    let huidigeStap = 0;
    let wakeLock = null;

    // ── TIMER STATE ──
    let timerSeconden = 0;
    let timerResterend = 0;
    let timerLoopt = false;
    let timerInterval = null;

    // ── UTILITIES ──

    function getParam(naam) {
      return new URLSearchParams(window.location.search).get(naam);
    }

    function formatHoeveelheid(basis, huidig, basis_porties) {
      if (basis === 0) return '';
      const waarde = (basis / basis_porties) * huidig;
      const afgerond = Math.round(waarde * 10) / 10;
      return afgerond % 1 === 0 ? String(afgerond | 0) : String(afgerond);
    }

    function stapSleutel() { return `stappen_${recept.id}`; }
    function ingSleutel() { return `ing_${recept.id}`; }

    // ── STAP AFVINKEN ──

    function laadAfgevinkt(sleutel) {
      try {
        return JSON.parse(localStorage.getItem(sleutel) || '[]');
      } catch { return []; }
    }

    function slaAfgevinktOp(sleutel, gedaan) {
      localStorage.setItem(sleutel, JSON.stringify(gedaan));
    }

    function toggleStap(nummer) {
      const key = stapSleutel();
      const gedaan = laadAfgevinkt(key);
      const idx = gedaan.indexOf(nummer);
      if (idx === -1) gedaan.push(nummer);
      else gedaan.splice(idx, 1);
      slaAfgevinktOp(key, gedaan);

      const el = document.querySelector(`.stap[data-stap="${nummer}"]`);
      if (el) el.classList.toggle('stap--gedaan', gedaan.includes(nummer));
    }

    function herstelStappen() {
      const gedaan = laadAfgevinkt(stapSleutel());
      gedaan.forEach(n => {
        const el = document.querySelector(`.stap[data-stap="${n}"]`);
        if (el) el.classList.add('stap--gedaan');
      });
    }

    // ── INGREDIËNT AFVINKEN ──

    function toggleIngredient(index) {
      const key = ingSleutel();
      const gedaan = laadAfgevinkt(key);
      const idx = gedaan.indexOf(index);
      if (idx === -1) gedaan.push(index);
      else gedaan.splice(idx, 1);
      slaAfgevinktOp(key, gedaan);

      const li = document.querySelectorAll('.ingredienten-lijst li')[index];
      if (li) li.classList.toggle('ing--gedaan', gedaan.includes(index));
    }

    function herstelIngredienten() {
      const gedaan = laadAfgevinkt(ingSleutel());
      const items = document.querySelectorAll('.ingredienten-lijst li');
      gedaan.forEach(i => { if (items[i]) items[i].classList.add('ing--gedaan'); });
    }

    // ── TIMER ──

    function parseerDuur(tekst) {
      // Bereik: "10-12 minuten" → bovengrens
      const bereik = tekst.match(/(\d+)\s*[-–]\s*(\d+)\s*(uur|min(?:uut|uten)?|sec(?:onden?)?)/i);
      if (bereik) {
        const boven = parseInt(bereik[2]);
        return /uur/i.test(bereik[3]) ? boven * 3600 : /min/i.test(bereik[3]) ? boven * 60 : boven;
      }
      // Decimaal: "1,5 min" → 90s, "1,25 uur" → 4500s
      const komma = tekst.match(/(\d+)[,.](\d+)\s*(uur|min(?:uut|uten)?)/i);
      if (komma) {
        const waarde = parseInt(komma[1]) + parseInt(komma[2]) / Math.pow(10, komma[2].length);
        return Math.round(/uur/i.test(komma[3]) ? waarde * 3600 : waarde * 60);
      }
      // Enkelvoud: "10 minuten", "2 uur", "30 seconden"
      const enkel = tekst.match(/(\d+)\s*(uur|min(?:uut|uten)?|sec(?:onden?)?)/i);
      if (enkel) {
        const v = parseInt(enkel[1]);
        return /uur/i.test(enkel[2]) ? v * 3600 : /min/i.test(enkel[2]) ? v * 60 : v;
      }
      return 0;
    }

    function formatTimer(sec) {
      const u = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (u > 0) return `${u}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerLoopt = false;
    }

    function startTimerInterval() {
      timerLoopt = true;
      timerInterval = setInterval(() => {
        timerResterend--;
        if (timerResterend <= 0) {
          timerResterend = 0;
          stopTimer();
          if (navigator.vibrate) navigator.vibrate([400, 100, 400, 100, 400]);
        }
        renderTimer();
      }, 1000);
    }

    function renderTimer() {
      const blok = document.getElementById('km-timer-blok');
      if (!blok) return;
      if (timerSeconden === 0) { blok.innerHTML = ''; return; }

      if (timerResterend <= 0) {
        blok.innerHTML = `<div class="km-timer-klaar">Tijd is om!</div>`;
        return;
      }

      if (!timerLoopt && timerResterend === timerSeconden) {
        // Nog niet gestart: toon startknop
        blok.innerHTML = `<button class="km-timer-start" id="km-timer-start">Timer ▸ ${formatTimer(timerSeconden)}</button>`;
        document.getElementById('km-timer-start').addEventListener('click', () => {
          startTimerInterval();
          renderTimer();
        });
      } else {
        // Actief of gepauzeerd
        const gepauzeerd = !timerLoopt ? ' km-timer-gepauzeerd' : '';
        blok.innerHTML = `
          <div class="km-timer-display${gepauzeerd}">${formatTimer(timerResterend)}</div>
          <div class="km-timer-knoppen">
            <button class="km-timer-knop" id="km-timer-pauze">${timerLoopt ? 'Pauze' : 'Hervat'}</button>
            <button class="km-timer-knop" id="km-timer-reset">Reset</button>
          </div>`;
        document.getElementById('km-timer-pauze').addEventListener('click', () => {
          if (timerLoopt) { stopTimer(); } else { startTimerInterval(); }
          renderTimer();
        });
        document.getElementById('km-timer-reset').addEventListener('click', () => {
          stopTimer();
          timerResterend = timerSeconden;
          renderTimer();
        });
      }
    }

    function initialiseerTimer(tekst) {
      stopTimer();
      timerSeconden = parseerDuur(tekst);
      timerResterend = timerSeconden;
      renderTimer();
    }

    // ── KOOKMODUS ──

    async function vraagWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch {}
    }

    function geefWakeLockVrij() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // Herkrijg wake lock als scherm terug zichtbaar wordt
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && document.getElementById('kookmodus-overlay').classList.contains('actief')) {
        await vraagWakeLock();
      }
    });

    function updateKookmodus() {
      const stappen = recept.stappen;
      const stap = stappen[huidigeStap];
      const totaal = stappen.length;

      document.getElementById('km-stap-tekst').textContent = stap.tekst;
      document.getElementById('km-teller').textContent = `${huidigeStap + 1} van ${totaal}`;
      initialiseerTimer(stap.tekst);

      // Voortgangsdots
      const dots = document.getElementById('km-voortgang');
      dots.innerHTML = stappen.map((_, i) => {
        const klasse = i < huidigeStap ? 'gedaan' : i === huidigeStap ? 'actief' : '';
        return `<div class="km-dot ${klasse}"></div>`;
      }).join('');

      // Knoppen
      const vorigeBtn = document.getElementById('km-vorige');
      const volgendeBtn = document.getElementById('km-volgende');

      vorigeBtn.disabled = huidigeStap === 0;

      if (huidigeStap === totaal - 1) {
        volgendeBtn.textContent = 'Klaar';
        volgendeBtn.className = 'km-nav-btn km-nav-btn--klaar';
      } else {
        volgendeBtn.textContent = 'Volgende';
        volgendeBtn.className = 'km-nav-btn km-nav-btn--volgende';
      }
    }

    function openKookmodus() {
      // Auto-uitvinken: ingrediënten zijn kennelijk in gebruik
      try {
        const inHuis = JSON.parse(localStorage.getItem('in_huis') || '[]');
        const idx = inHuis.indexOf(recept.id);
        if (idx !== -1) {
          inHuis.splice(idx, 1);
          localStorage.setItem('in_huis', JSON.stringify(inHuis));
        }
      } catch {}

      huidigeStap = 0;
      document.getElementById('km-recept-titel').textContent = recept.titel;
      document.getElementById('kookmodus-overlay').classList.add('actief');
      document.getElementById('bottom-tab-bar')?.style.setProperty('display', 'none');
      updateKookmodus();
      vraagWakeLock();
      document.getElementById('km-sluiten').focus();
    }

    function sluitKookmodus() {
      stopTimer();
      document.getElementById('kookmodus-overlay').classList.remove('actief');
      document.getElementById('bottom-tab-bar')?.style.removeProperty('display');
      geefWakeLockVrij();
    }

    document.getElementById('km-sluiten').addEventListener('click', sluitKookmodus);

    document.getElementById('km-vorige').addEventListener('click', () => {
      if (huidigeStap > 0) { huidigeStap--; updateKookmodus(); }
    });

    document.getElementById('km-volgende').addEventListener('click', () => {
      if (huidigeStap < recept.stappen.length - 1) {
        huidigeStap++;
        updateKookmodus();
      } else {
        sluitKookmodus();
      }
    });

    // Swipe navigatie in kookmodus (exclusief schermrand voor iOS back gesture)
    let swipeX0 = null;
    document.getElementById('kookmodus-overlay').addEventListener('touchstart', e => {
      const x = e.touches[0].clientX;
      swipeX0 = (x > 30 && x < window.innerWidth - 30) ? x : null;
    }, { passive: true });
    document.getElementById('kookmodus-overlay').addEventListener('touchend', e => {
      if (swipeX0 === null) return;
      const dx = e.changedTouches[0].clientX - swipeX0;
      swipeX0 = null;
      if (Math.abs(dx) < 60) return;
      if (dx > 0) document.getElementById('km-vorige').click();
      else document.getElementById('km-volgende').click();
    });

    // Toetsenbord navigatie + focus trap in kookmodus
    document.addEventListener('keydown', e => {
      const overlay = document.getElementById('kookmodus-overlay');
      if (!overlay.classList.contains('actief')) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('km-volgende').click(); }
      if (e.key === 'ArrowLeft') document.getElementById('km-vorige').click();
      if (e.key === 'Escape') sluitKookmodus();
      if (e.key === 'Tab') {
        const focusable = overlay.querySelectorAll('button:not([disabled])');
        if (focusable.length === 0) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // ── PORTIESCHALER ──

    function updateIngredientHoeveelheden() {
      document.querySelectorAll('.ingredienten-lijst li').forEach((li, i) => {
        const ing = recept.ingredienten[i];
        const hoeveelheid = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties);
        const eenheid = ing.eenheid === 'naar smaak' ? '' : ing.eenheid;
        const rechts = ing.eenheid === 'naar smaak'
          ? 'naar smaak'
          : `${hoeveelheid} ${eenheid}`.trim();
        li.querySelector('.ingredient-hoeveelheid').textContent = rechts;
      });
      document.querySelector('.portie-aantal').textContent = huidigPorties;
    }

    // ── INGREDIËNT SCHALING ──
    // Klik op een hoeveelheid → pas aan → alles schaalt mee

    function startIngredientEdit(li, index) {
      const ing = recept.ingredienten[index];
      if (ing.hoeveelheid === 0 || ing.eenheid === 'naar smaak') return;

      const hSpan = li.querySelector('.ingredient-hoeveelheid');
      const huidigeWaarde = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties);

      // Vervang span door input
      const input = document.createElement('input');
      input.type = 'number';
      input.value = huidigeWaarde;
      input.step = 'any';
      input.min = '0';
      input.style.cssText = 'width:4.5rem;padding:0.25rem 0.4rem;font-family:var(--mono);font-size:0.8125rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--accent);color:var(--accent);text-align:right;outline:none;';

      const eenheid = ing.eenheid;
      const eenheidSpan = document.createElement('span');
      eenheidSpan.textContent = ` ${eenheid}`;
      eenheidSpan.style.fontSize = '0.9rem';

      hSpan.textContent = '';
      hSpan.appendChild(input);
      hSpan.appendChild(eenheidSpan);
      input.focus();
      input.select();

      const bevestig = () => {
        const nieuweWaarde = parseFloat(input.value);
        if (!nieuweWaarde || nieuweWaarde <= 0) {
          updateIngredientHoeveelheden();
          return;
        }
        // Bereken de verhouding: nieuwe waarde / oorspronkelijke waarde voor dit ingrediënt
        const basisWaarde = ing.hoeveelheid / basisPorties;
        const factor = nieuweWaarde / basisWaarde;
        huidigPorties = Math.round(factor * 10) / 10;
        // Update portie-display en alle hoeveelheden
        updateIngredientHoeveelheden();
      };

      input.addEventListener('blur', bevestig);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { input.blur(); }
        if (e.key === 'Escape') { updateIngredientHoeveelheden(); }
      });
    }

    // ── RENDER ──

    function renderIngredient(ing, index) {
      const hoeveelheid = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties);
      const eenheid = ing.eenheid === 'naar smaak' ? '' : ing.eenheid;
      const rechts = ing.eenheid === 'naar smaak'
        ? 'naar smaak'
        : `${hoeveelheid} ${eenheid}`.trim();
      const klikbaar = ing.hoeveelheid > 0 && ing.eenheid !== 'naar smaak'
        ? ' style="cursor:pointer" title="Klik om aan te passen"' : '';
      return `<li data-ing-index="${index}">
        <span class="ingredient-naam">${ing.naam}</span>
        <span class="ingredient-hoeveelheid"${klikbaar}>${rechts}</span>
      </li>`;
    }

    function renderRecept(r) {
      recept = r;
      basisPorties = r.porties;
      huidigPorties = r.porties;
      document.title = `${r.titel} — Onze Recepten`;

      // Dynamische OG meta tags
      function setMeta(attr, attrValue, content) {
        let el = document.querySelector(`meta[${attr}="${attrValue}"]`);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, attrValue);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }
      setMeta('property', 'og:title', r.titel);
      setMeta('property', 'og:description', r.beschrijving || '');
      setMeta('property', 'og:type', 'article');
      if (r.afbeelding) {
        setMeta('property', 'og:image', r.afbeelding);
      }

      const headerFoto = r.afbeelding
        ? `<img class="recept-header-foto" src="${r.afbeelding}" alt="${r.titel}">`
        : '';

      const beschrijvingHtml = r.beschrijving
        ? `<p class="recept-detail__beschrijving">${r.beschrijving}</p>`
        : '';

      const tags = r.tags.map(t => `<span class="tag">${t}</span>`).join('');
      const ingredienten = r.ingredienten.map((ing, i) => renderIngredient(ing, i)).join('');
      const stappen = r.stappen.map(s => `
        <div class="stap" data-stap="${s.nummer}" role="button" tabindex="0" aria-label="Stap ${s.nummer}">
          <span class="stap-nummer">${s.nummer}</span>
          <p class="stap-tekst">${s.tekst}</p>
        </div>`).join('');

      const heeftVoeding = r.voedingswaarden && (r.voedingswaarden.kcal || r.voedingswaarden.eiwitten || r.voedingswaarden.koolhydraten || r.voedingswaarden.vetten);
      const vw = r.voedingswaarden || {};
      const voeding = heeftVoeding ? `
        <div class="voeding-sectie">
          <div class="blok-titel">Voedingswaarden per portie</div>
          <div class="voeding-grid">
            ${vw.kcal != null ? `<div class="voeding-item"><span class="voeding-waarde">${vw.kcal}</span><span class="voeding-label">kcal</span></div>` : ''}
            ${vw.eiwitten != null ? `<div class="voeding-item"><span class="voeding-waarde">${vw.eiwitten}g</span><span class="voeding-label">eiwit</span></div>` : ''}
            ${vw.koolhydraten != null ? `<div class="voeding-item"><span class="voeding-waarde">${vw.koolhydraten}g</span><span class="voeding-label">koolhydraten</span></div>` : ''}
            ${vw.vetten != null ? `<div class="voeding-item"><span class="voeding-waarde">${vw.vetten}g</span><span class="voeding-label">vet</span></div>` : ''}
          </div>
        </div>` : '';

      let bron = '';
      if (r.bron_naam && r.bron_naam !== 'Handmatig') {
        const naam = r.bron_naam;
        bron = r.bron
          ? `<span class="bron-label">Originele bron: <a class="bron-link" href="${r.bron}" target="_blank" rel="noopener">${naam}</a></span>`
          : `<span class="bron-label">Originele bron: ${naam}</span>`;
      }

      document.getElementById('app').innerHTML = `
        <div class="recept-detail">
          <a class="terug-link" href="./index.html">Alle recepten</a>
          <div class="recept-detail__header${r.afbeelding ? '' : ' recept-detail__header--geen-foto'}">
            <div class="recept-detail__header-tekst">
              <h1 class="recept-detail__title">${r.titel}</h1>
              ${beschrijvingHtml}
              <div class="recept-detail__meta">
                <span>${r.actieve_tijd ? r.actieve_tijd + ' min actief' : r.bereidingstijd + ' min'}</span>
                ${r.passieve_tijd ? `<span>${r.passieve_tijd} min oven/rust</span>` : ''}
                <span>${r.moeilijkheidsgraad}</span>
              </div>
              <div class="recept-detail__tags">${tags}</div>
            </div>
            ${headerFoto}
          </div>

          <div class="portie-schaler">
            <label class="portie-label">Porties</label>
            <button class="portie-btn" id="min-btn">−</button>
            <span class="portie-aantal">${huidigPorties}</span>
            <button class="portie-btn" id="plus-btn">+</button>
            ${r.tags.includes('babyvriendelijk') ? `<button class="mae-toggle" id="mae-toggle">Mae modus</button>` : ''}
          </div>
          ${r.tags.includes('babyvriendelijk') ? `<div class="mae-banner" id="mae-banner" style="display:none">
            <div class="mae-banner__title">Mae modus actief</div>
            <div class="mae-banner__tekst">Stappen met kruiden/zout zijn gemarkeerd. Schep Mae's portie apart vóór het op smaak brengen.</div>
          </div>` : ''}

          <div class="recept-content">
            <div class="ingredienten-blok">
              <div class="blok-titel">Ingrediënten</div>
              <ul class="ingredienten-lijst">${ingredienten}</ul>
            </div>
            <div class="stappen-blok">
              <button class="kookmodus-btn" id="kookmodus-btn">Start kookmodus</button>
              ${stappen}
            </div>
          </div>

          ${voeding}
          <div class="recept-acties">
            ${bron}
            <button class="boodschappen-btn" id="boodschappen-btn">Kopieer boodschappenlijst</button>
            <button class="print-btn" id="print-btn">Print recept</button>
          </div>
        </div>`;

      // Portie knoppen
      document.getElementById('min-btn').addEventListener('click', () => {
        if (huidigPorties > 1) { huidigPorties--; updateIngredientHoeveelheden(); }
      });
      document.getElementById('plus-btn').addEventListener('click', () => {
        huidigPorties++;
        updateIngredientHoeveelheden();
      });

      // Mae modus
      const maeToggle = document.getElementById('mae-toggle');
      if (maeToggle) {
        const maeKey = `mae_${recept.id}`;
        let maeActief = localStorage.getItem(maeKey) === 'true';
        const maeKeywords = /zout|peper|kruiden|chili|harissa|sojasaus|ketjap|tabasco|sambal|cayenne|paprikapoeder|mosterd|za'atar|shoarma/i;

        function updateMaeModus() {
          const banner = document.getElementById('mae-banner');
          maeToggle.classList.toggle('mae-toggle--actief', maeActief);
          banner.style.display = maeActief ? '' : 'none';

          document.querySelectorAll('.stap').forEach(stap => {
            const tekst = stap.querySelector('.stap-tekst')?.textContent || '';
            const bestaandeTip = stap.querySelector('.mae-tip');
            if (bestaandeTip) bestaandeTip.remove();

            if (maeActief && maeKeywords.test(tekst)) {
              const tip = document.createElement('div');
              tip.className = 'mae-tip';
              tip.textContent = 'Mae: schep haar portie apart vóór deze stap';
              stap.appendChild(tip);
            }
          });

          // Also mark ingredients
          document.querySelectorAll('.ingredienten-lijst li').forEach((li, i) => {
            const naam = recept.ingredienten[i]?.naam || '';
            const bestaand = li.querySelector('.mae-skip');
            if (bestaand) bestaand.remove();
            if (maeActief && maeKeywords.test(naam)) {
              const skip = document.createElement('span');
              skip.className = 'mae-skip';
              skip.textContent = 'overslaan voor Mae';
              li.appendChild(skip);
            }
          });
        }

        if (maeActief) updateMaeModus();

        maeToggle.addEventListener('click', () => {
          maeActief = !maeActief;
          localStorage.setItem(maeKey, maeActief);
          updateMaeModus();
        });
      }

      // Kookmodus knop
      document.getElementById('kookmodus-btn').addEventListener('click', openKookmodus);

      // Print knop
      document.getElementById('print-btn').addEventListener('click', () => window.print());

      // Boodschappenlijst knop
      document.getElementById('boodschappen-btn').addEventListener('click', () => {
        const inHuis = (() => { try { return JSON.parse(localStorage.getItem('in_huis') || '[]'); } catch { return []; } })();
        const alleInHuis = inHuis.includes(recept.id);
        const ingredienten = alleInHuis ? [] : recept.ingredienten;

        if (ingredienten.length === 0) {
          const btn = document.getElementById('boodschappen-btn');
          const origineel = btn.textContent;
          btn.textContent = 'Alles al in huis!';
          btn.classList.add('bevestigd');
          setTimeout(() => { btn.textContent = origineel; btn.classList.remove('bevestigd'); }, 2000);
          return;
        }

        const regels = ingredienten.map(ing => {
          if (ing.eenheid === 'naar smaak') return `- ${ing.naam} (naar smaak)`;
          const hoeveelheid = ing.hoeveelheid === 0 ? ''
            : (() => {
                const v = (ing.hoeveelheid / basisPorties) * huidigPorties;
                const a = Math.round(v * 10) / 10;
                return (a % 1 === 0 ? String(a | 0) : String(a)) + ' ';
              })();
          return `- ${ing.naam}: ${hoeveelheid}${ing.eenheid}`.trimEnd();
        });

        const tekst = `${recept.titel} (${huidigPorties} porties)\n\n${regels.join('\n')}`;
        navigator.clipboard.writeText(tekst).then(() => {
          const btn = document.getElementById('boodschappen-btn');
          const origineel = btn.textContent;
          btn.textContent = 'Gekopieerd!';
          btn.classList.add('bevestigd');
          setTimeout(() => { btn.textContent = origineel; btn.classList.remove('bevestigd'); }, 2000);
        }).catch(() => {
          const btn = document.getElementById('boodschappen-btn');
          btn.textContent = 'Kopiëren mislukt';
          setTimeout(() => { btn.textContent = 'Kopieer boodschappenlijst'; }, 2000);
        });
      });

      // Ingrediënt: klik op naam = afvinken, klik op hoeveelheid = aanpassen
      document.querySelectorAll('.ingredienten-lijst li').forEach((li, i) => {
        const naam = li.querySelector('.ingredient-naam');
        const hoeveelheid = li.querySelector('.ingredient-hoeveelheid');
        if (naam) naam.addEventListener('click', (e) => { e.stopPropagation(); toggleIngredient(i); });
        if (hoeveelheid && recept.ingredienten[i].hoeveelheid > 0) {
          hoeveelheid.addEventListener('click', (e) => { e.stopPropagation(); startIngredientEdit(li, i); });
        }
      });
      herstelIngredienten();

      // Stap afvinken
      document.querySelectorAll('.stap').forEach(el => {
        el.addEventListener('click', () => toggleStap(+el.dataset.stap));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') toggleStap(+el.dataset.stap);
        });
      });
      herstelStappen();
    }

    async function init() {
      const id = getParam('id');
      if (!id) { toonNietGevonden(); return; }
      try {
        const res = await fetch('./data/recepten.json');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const r = data.recepten.find(r => r.id === id);
        if (!r) { toonNietGevonden(); return; }
        renderRecept(r);
      } catch {
        toonNietGevonden();
      }
    }

    function toonNietGevonden() {
      document.getElementById('app').innerHTML = `
        <div class="not-found">
          <h2>Recept niet gevonden</h2>
          <p><a href="./index.html">Terug naar overzicht</a></p>
        </div>`;
    }

    // Theme toggle
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    init();
  </script>

</body>
</html>
