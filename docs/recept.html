  <div id="app"></div>

  <!-- Kookmodus overlay -->
  <div class="kookmodus-overlay" id="kookmodus-overlay" role="dialog" aria-modal="true">

    </div>
    <div class="km-nav">

      <button class="km-nav-btn km-nav-btn--volgende" id="km-volgende">Volgende</button>
    </div>

  <nav class="tabbalk" aria-label="Hoofdnavigatie">

  <script src="./js/gedeeld.js?v=450773"></script>
  <script src="./js/ingredient-icoon.js?v=450773"></script>
  <script src="./js/opslag.js?v=450773"></script>

  <script>
    let recept = null;
    // Hoeveel porties je standaard wilt zien. Vier: koken voor twee dagen.
    const STANDAARD_PORTIES = 4;

    let huidigPorties = 1;
    let basisPorties = 1;
    let huidigeStap = 0;
    let wakeLock = null;

    // ── UTILITIES ──

    function getParam(naam) {
      return new URLSearchParams(window.location.search).get(naam);
    }

    function stapSleutel() { return `stappen_${recept.id}`; }
    function ingSleutel() { return `ing_${recept.id}`; }

    // ── BOODSCHAPPENLIJST ──
    // Vaste voorraadkast: ingrediënten die je standaard in huis hebt en
    // dus NIET op de boodschappenlijst hoeven. Pas deze lijst gerust aan.
    const VOORRAADKAST = [
      'zout', 'peper', 'olie', 'olijfolie', 'zonnebloemolie', 'bakolie',
      'boter', 'roomboter', 'water', 'suiker', 'bloem', 'azijn',
      'knoflook', 'ui', 'uien'
    ];

    // Naam van de Apple Shortcut die de items in Herinneringen zet
    const SHORTCUT_NAAM = 'Boodschappen';

    // Naam van de Shortcut die een échte timer in de Klok-app zet.
    // De timer in de pagina stopt zodra iOS Safari naar de achtergrond duwt;
    // alleen de Klok-app blijft doorlopen met het scherm uit.
    const SHORTCUT_TIMER = 'Kooktimer';

    function isVoorraad(naam) {
      const tokens = naam.toLowerCase().split(/[^a-zà-ÿ]+/).filter(Boolean);
      return tokens.some(t => VOORRAADKAST.some(v => t.startsWith(v)));
    }

    // Bouwt de boodschappenlijst voor de HUIDIGE porties, zonder voorraadkast-items
    function buildBoodschappen() {
      return recept.ingredienten
        .filter(ing => !isVoorraad(ing.naam))
        .map(ing => {
          if (ing.eenheid === 'naar smaak' || ing.hoeveelheid === 0) return ing.naam;
          const hoeveelheid = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties, ing.eenheid);
          const eenheid = ing.eenheid === 'stuks' ? 'x' : ing.eenheid;
          return `${ing.naam} (${hoeveelheid} ${eenheid})`.replace(' x)', 'x)');
        });
    }

    function toonToast(bericht) {
      let el = document.getElementById('boodschappen-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'boodschappen-toast';
        el.className = 'boodschappen-toast';
        document.body.appendChild(el);
      }
      el.textContent = bericht;
      el.classList.add('zichtbaar');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('zichtbaar'), 3200);
    }

    async function zetOpBoodschappenlijst() {
      const items = buildBoodschappen();
      if (!items.length) {
        toonToast('Alles al in huis — niks toe te voegen');
        return;
      }
      const tekst = items.join('\n');

      // Kopieer als vangnet (werkt overal)
      try { await navigator.clipboard.writeText(tekst); } catch {}

      // Roep de Apple Shortcut aan die de items in Herinneringen zet
      const url = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAAM)}`
        + `&input=text&text=${encodeURIComponent(tekst)}`;
      window.location.href = url;

      toonToast(`${items.length} item${items.length === 1 ? '' : 's'} → boodschappenlijst`);
    }

    // ── STAP AFVINKEN ──

    function laadAfgevinkt(sleutel) {
      try {
        return JSON.parse(localStorage.getItem(sleutel) || '[]');
      } catch { return []; }
    }

    function slaAfgevinktOp(sleutel, gedaan) {
      localStorage.setItem(sleutel, JSON.stringify(gedaan));
    }

    function toggleStap(nummer) {
      const key = stapSleutel();
      const gedaan = laadAfgevinkt(key);
      const idx = gedaan.indexOf(nummer);
      if (idx === -1) gedaan.push(nummer);
      else gedaan.splice(idx, 1);
      slaAfgevinktOp(key, gedaan);

      const el = document.querySelector(`.stap[data-stap="${nummer}"]`);
      if (el) el.classList.toggle('stap--gedaan', gedaan.includes(nummer));
      werkBadgesBij();
    }

    function herstelStappen() {
      const gedaan = laadAfgevinkt(stapSleutel());
      gedaan.forEach(n => {
        const el = document.querySelector(`.stap[data-stap="${n}"]`);
        if (el) el.classList.add('stap--gedaan');
      });
    }

    // ── INGREDIËNT AFVINKEN ──

    function toggleIngredient(index) {
      const key = ingSleutel();
      const gedaan = laadAfgevinkt(key);
      const idx = gedaan.indexOf(index);
      if (idx === -1) gedaan.push(index);
      else gedaan.splice(idx, 1);
      slaAfgevinktOp(key, gedaan);

      const li = document.querySelectorAll('.ingredienten-lijst li')[index];
      if (li) {
        const aan = gedaan.includes(index);
        li.classList.toggle('ing--gedaan', aan);
        const v = li.querySelector('.vink');
        if (v) v.setAttribute('aria-pressed', String(aan));
      }
      werkBadgesBij();
    }

    function herstelIngredienten() {
      const gedaan = laadAfgevinkt(ingSleutel());
      const items = document.querySelectorAll('.ingredienten-lijst li');
      gedaan.forEach(i => {
        if (!items[i]) return;
        items[i].classList.add('ing--gedaan');
        const v = items[i].querySelector('.vink');
        if (v) v.setAttribute('aria-pressed', 'true');
      });
      werkBadgesBij();
    }

    // ── KOOKMODUS ──

    async function vraagWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch {}
    }

    function geefWakeLockVrij() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // Herkrijg wake lock als scherm terug zichtbaar wordt
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && document.getElementById('kookmodus-overlay').classList.contains('actief')) {
        await vraagWakeLock();
      }
    });

    function updateKookmodus() {
      const stappen = recept.stappen;
      const stap = stappen[huidigeStap];
      const totaal = stappen.length;

      document.getElementById('km-stap-tekst').textContent = stap.tekst;
      document.getElementById('km-teller').textContent = `Stap ${huidigeStap + 1} van ${totaal}`;

      // Wat je bij déze stap nodig hebt, met de hoeveelheid voor het gekozen
      // aantal porties. Zo hoef je tijdens het koken niet terug te bladeren.
      const nodig = ingredientenVoorStap(stap.tekst);
      const strook = document.getElementById('km-ingredienten');
      strook.innerHTML = nodig.map(ing => {
        const hoeveelheid = ing.eenheid === 'naar smaak' || ing.hoeveelheid === 0
          ? 'naar smaak'
          : `${formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties, ing.eenheid)} ${ing.eenheid === 'stuks' ? '' : ing.eenheid}`.trim();
        return `<span class="km-ing"><b>${hoeveelheid}</b> ${metHoofdletter(ing.naam)}</span>`;
      }).join('');
      strook.hidden = nodig.length === 0;

      // Staat er een tijd in de stap, dan één grote knop om die timer te zetten
      const timerKnop = document.getElementById('km-timer-knop');
      const seconden = secondenInTekst(stap.tekst);
      if (seconden) {
        timerKnop.hidden = false;
        timerKnop.innerHTML =
          `<svg class="ic klein" viewBox="0 0 24 24"><use href="#i-klok"/></svg>Timer ${tijdTekst(seconden)}`;
        timerKnop.onclick = () => startTimer(seconden, `Stap ${huidigeStap + 1}`);
      } else {
        timerKnop.hidden = true;
        timerKnop.onclick = null;
      }

      // Voortgangsdots
      const dots = document.getElementById('km-voortgang');
      dots.innerHTML = stappen.map((_, i) => {
        const klasse = i < huidigeStap ? 'gedaan' : i === huidigeStap ? 'actief' : '';
        return `<div class="km-dot ${klasse}"></div>`;
      }).join('');

      // Knoppen
      const vorigeBtn = document.getElementById('km-vorige');
      const volgendeBtn = document.getElementById('km-volgende');

      vorigeBtn.disabled = huidigeStap === 0;

      if (huidigeStap === totaal - 1) {
        volgendeBtn.textContent = 'Klaar';
        volgendeBtn.className = 'km-nav-btn km-nav-btn--klaar';
      } else {
        volgendeBtn.textContent = 'Volgende';
        volgendeBtn.className = 'km-nav-btn km-nav-btn--volgende';
      }
    }

    // Met vieze handen wil je niet naar een knopje mikken. Een tik op het
    // midden van het scherm gaat verder; de knoppen onderin blijven bestaan
    // voor wie ze zoekt, en vegen werkt beide kanten op.
    function koppelKookGebaren() {
      const inhoud = document.querySelector('.km-inhoud');
      if (!inhoud || inhoud.dataset.gekoppeld) return;
      inhoud.dataset.gekoppeld = 'ja';

      inhoud.addEventListener('click', e => {
        // Niet doorschieten als je op de timerknop of een chip tikt
        if (e.target.closest('button')) return;
        document.getElementById('km-volgende').click();
      });

      let startX = null;
      inhoud.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      inhoud.addEventListener('touchend', e => {
        if (startX === null) return;
        const verschil = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(verschil) < 60) return;
        document.getElementById(verschil < 0 ? 'km-volgende' : 'km-vorige').click();
      }, { passive: true });
    }

    function openKookmodus() {
      huidigeStap = 0;
      document.getElementById('km-recept-titel').textContent = recept.titel;
      document.getElementById('kookmodus-overlay').classList.add('actief');
      updateKookmodus();
      koppelKookGebaren();
      vraagWakeLock();
    }

    function sluitKookmodus() {
      document.getElementById('kookmodus-overlay').classList.remove('actief');
      geefWakeLockVrij();
    }

    document.getElementById('km-sluiten').addEventListener('click', sluitKookmodus);

    document.getElementById('km-vorige').addEventListener('click', () => {
      if (huidigeStap > 0) { huidigeStap--; updateKookmodus(); }
    });

    document.getElementById('km-volgende').addEventListener('click', () => {
      if (huidigeStap < recept.stappen.length - 1) {
        huidigeStap++;
        updateKookmodus();
      } else {
        // Laatste stap: dit is het moment waarop we weten dat je het maakte
        noteerGemaakt(recept.id);
        const regel = document.querySelector('#gemaakt-regel span');
        if (regel) regel.textContent = gemaaktLangeTekst(recept.id);
        sluitKookmodus();
        toonToast('Genoteerd — ' + gemaaktTekst(recept.id));
      }
    });

    // Toetsenbord navigatie in kookmodus
    document.addEventListener('keydown', e => {
      if (!document.getElementById('kookmodus-overlay').classList.contains('actief')) return;
      if (e.key === 'ArrowRight' || e.key === ' ') document.getElementById('km-volgende').click();
      if (e.key === 'ArrowLeft') document.getElementById('km-vorige').click();
      if (e.key === 'Escape') sluitKookmodus();
    });

    // ── PORTIESCHALER ──

    function updateIngredientHoeveelheden() {
      document.querySelectorAll('.ingredienten-lijst li').forEach((li, i) => {
        const ing = recept.ingredienten[i];
        const hoeveelheid = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties, ing.eenheid);
        const eenheid = ing.eenheid === 'naar smaak' ? '' : ing.eenheid;
        const rechts = ing.eenheid === 'naar smaak'
          ? 'naar smaak'
          : `${hoeveelheid} ${eenheid}`.trim();
        li.querySelector('.ingredient-hoeveelheid').textContent = rechts;
      });
      document.querySelector('.portie-aantal').textContent = huidigPorties;
    }

    // ── INGREDIËNT SCHALING ──
    // Klik op een hoeveelheid → pas aan → alles schaalt mee

    function startIngredientEdit(li, index) {
      const ing = recept.ingredienten[index];
      if (ing.hoeveelheid === 0 || ing.eenheid === 'naar smaak') return;

      const hSpan = li.querySelector('.ingredient-hoeveelheid');
      const huidigeWaarde = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties, ing.eenheid);

      // Vervang span door input
      const input = document.createElement('input');
      input.type = 'number';
      input.value = huidigeWaarde;
      input.step = 'any';
      input.min = '0';
      input.style.cssText = 'width:4rem;padding:0.2rem 0.4rem;font:inherit;font-size:0.9rem;font-weight:600;background:rgba(245,239,230,0.15);border:1px solid rgba(245,239,230,0.4);border-radius:4px;color:var(--card-light);text-align:right;outline:none;';

      const eenheid = ing.eenheid;
      const eenheidSpan = document.createElement('span');
      eenheidSpan.textContent = ` ${eenheid}`;
      eenheidSpan.style.fontSize = '0.9rem';

      hSpan.textContent = '';
      hSpan.appendChild(input);
      hSpan.appendChild(eenheidSpan);
      input.focus();
      input.select();

      const bevestig = () => {
        const nieuweWaarde = parseFloat(input.value);
        if (!nieuweWaarde || nieuweWaarde <= 0) {
          updateIngredientHoeveelheden();
          return;
        }
        // Bereken de verhouding: nieuwe waarde / oorspronkelijke waarde voor dit ingrediënt
        const basisWaarde = ing.hoeveelheid / basisPorties;
        const factor = nieuweWaarde / basisWaarde;
        huidigPorties = Math.round(factor * 10) / 10;
        // Update portie-display en alle hoeveelheden
        updateIngredientHoeveelheden();
      };

      input.addEventListener('blur', bevestig);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { input.blur(); }
        if (e.key === 'Escape') { updateIngredientHoeveelheden(); }
      });
    }

    // ── FOTO ──

    async function verwerkFoto(e) {
      const bestand = e.target.files && e.target.files[0];
      if (!bestand) return;
      const status = document.getElementById('foto-status');
      status.hidden = false;
      status.textContent = 'Foto verkleinen en bewaren...';
      try {
        const pad = await bewaarFoto(recept, bestand);
        status.textContent = 'Gelukt. De site is binnen een minuut bijgewerkt.';
        // Meteen tonen, zonder te wachten op de deploy
        const hero = document.querySelector('.recept-hero');
        const leeg = document.querySelector('.recept-hero-placeholder');
        const bron = URL.createObjectURL(bestand);
        if (hero) hero.src = bron;
        else if (leeg) leeg.outerHTML = `<img class="recept-hero" src="${bron}" alt="">`;
        recept.afbeelding = pad;
        setTimeout(() => { status.hidden = true; }, 4000);
      } catch (fout) {
        status.textContent = 'Mislukt: ' + fout.message;
      } finally {
        e.target.value = '';
      }
    }

    // ── VERWIJDEREN ──
    // Twee tikken: de eerste vraagt, de tweede doet het. Zo gooi je niets weg
    // met een misklik terwijl het nog steeds snel gaat.

    let verwijderBevestigd = false;

    async function vraagVerwijderen() {
      const knop = document.getElementById('verwijder-btn');
      const uitleg = document.getElementById('verwijder-uitleg');

      if (!heeftToken()) {
        uitleg.hidden = false;
        uitleg.textContent = 'Om te verwijderen heb ik eenmalig een GitHub-token nodig.';
        vraagToken(knop.parentElement, vraagVerwijderen);
        return;
      }

      if (!verwijderBevestigd) {
        verwijderBevestigd = true;
        knop.textContent = 'Zeker weten? Tik nog een keer';
        knop.classList.add('verwijder-btn--zeker');
        uitleg.hidden = false;
        uitleg.textContent = 'Dit haalt het recept van de site af.';
        setTimeout(() => {
          if (!verwijderBevestigd) return;
          verwijderBevestigd = false;
          knop.textContent = 'Verwijder dit recept';
          knop.classList.remove('verwijder-btn--zeker');
          uitleg.hidden = true;
        }, 6000);
        return;
      }

      knop.disabled = true;
      knop.textContent = 'Bezig met verwijderen...';
      try {
        const over = await verwijderRecept(recept.id, recept.titel);
        knop.textContent = 'Verwijderd';
        uitleg.textContent = `Nog ${over} recepten. De site is binnen een minuut bijgewerkt.`;
        setTimeout(() => { window.location.href = './index.html'; }, 1800);
      } catch (e) {
        knop.disabled = false;
        verwijderBevestigd = false;
        knop.textContent = 'Verwijder dit recept';
        knop.classList.remove('verwijder-btn--zeker');
        uitleg.hidden = false;
        uitleg.textContent = e.message;
      }
    }

    // ── FAVORIETEN ──
    // Eén lijst met recept-id's in localStorage, gedeeld met het overzicht.


    function hartKnop(id, extraKlasse = '') {
      const aan = isFavoriet(id);
      return `<button class="hart-btn ${extraKlasse}" data-recept="${id}"
        aria-pressed="${aan}" aria-label="${aan ? 'Uit favorieten halen' : 'Aan favorieten toevoegen'}"
        ><svg viewBox="0 0 24 24"><use href="#i-hart"/></svg></button>`;
    }

    function koppelHart(knop) {
      if (!knop) return;
      knop.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const aan = wisselFavoriet(knop.dataset.recept);
        knop.setAttribute('aria-pressed', String(aan));
        knop.setAttribute('aria-label', aan ? 'Uit favorieten halen' : 'Aan favorieten toevoegen');
      });
    }

    // ── FASE-TABS ──
    // Laat zien in welke fase je zit, met per fase wat er nog open staat.

    function zetFaseTabsOp() {
      const tabs = [...document.querySelectorAll('.fase-tab')];
      const pil = document.getElementById('fase-pil');
      if (!tabs.length || !pil) return;

      function verplaatsPil(tab) {
        pil.style.width = tab.offsetWidth + 'px';
        pil.style.transform = `translateX(${tab.offsetLeft - 2}px)`;
      }

      function kies(fase) {
        tabs.forEach(t => {
          const aan = t.dataset.fase === fase;
          t.setAttribute('aria-selected', String(aan));
          const paneel = document.getElementById('paneel-' + t.dataset.fase);
          if (paneel) paneel.hidden = !aan;
          if (aan) verplaatsPil(t);
        });
      }

      tabs.forEach(t => t.addEventListener('click', () => kies(t.dataset.fase)));
      kies('ingredienten');
      // De pil staat pas goed als de breedtes bekend zijn
      requestAnimationFrame(() => verplaatsPil(tabs.find(t => t.getAttribute('aria-selected') === 'true')));
      window.addEventListener('resize', () => {
        const actief = tabs.find(t => t.getAttribute('aria-selected') === 'true');
        if (actief) verplaatsPil(actief);
      });
      werkBadgesBij();
    }

    // Toont hoeveel ingrediënten en stappen er nog open staan
    function werkBadgesBij() {
      const paren = [
        ['badge-ingredienten', '.ingredienten-lijst li', 'ing--gedaan'],
        ['badge-bereiding', '.stap', 'stap--gedaan'],
      ];
      paren.forEach(([badgeId, selector, gedaanKlasse]) => {
        const badge = document.getElementById(badgeId);
        if (!badge) return;
        const alles = document.querySelectorAll(selector);
        const open = [...alles].filter(el => !el.classList.contains(gedaanKlasse)).length;
        badge.textContent = open === 0 ? '✓' : String(open);
        badge.dataset.klaar = open === 0 ? 'ja' : 'nee';
      });
    }

    // ── TIMER ──

    /* Meer dan één timer tegelijk. Elke stap met een tijd erin krijgt een eigen
       knop, dus je tikt er zo twee achter elkaar aan: de oven van 30 minuten en
       daarna de pasta van 10. Daarvoor overschreef de tweede de eerste zonder
       iets te zeggen, en stond je ovenschotel stil te verbranden. */
    let timers = [];
    let timerNr = 0;

    function tijdTekst(seconden) {
      const m = Math.floor(seconden / 60), s = seconden % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function timerStapel() {
      let el = document.getElementById('timer-stapel');
      if (!el) {
        el = document.createElement('div');
        el.id = 'timer-stapel';
        el.className = 'timer-stapel';
        document.body.appendChild(el);
      }
      return el;
    }

    function balkVan(id) {
      return timerStapel().querySelector(`.timer-balk[data-id="${id}"]`);
    }

    function maakBalk(t) {
      const el = document.createElement('div');
      el.className = 'timer-balk';
      el.dataset.id = t.id;
      el.innerHTML = `
        <svg class="timer-ring" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="timer-ring__baan" cx="22" cy="22" r="19"></circle>
          <circle class="timer-ring__voortgang" cx="22" cy="22" r="19"
                  stroke-dasharray="119.4" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-info">
          <div class="timer-tijd">0:00</div>
          <div class="timer-label"></div>
        </div>
        <div class="timer-acties">
          <button class="timer-btn timer-klok" aria-label="Ook in Klok-app zetten" title="Zet in Klok-app">
            <svg viewBox="0 0 16 16"><path d="M8 1.2a6.8 6.8 0 100 13.6A6.8 6.8 0 008 1.2zm0 1.6a5.2 5.2 0 110 10.4A5.2 5.2 0 018 2.8zm-.8 1.6v4l3.2 1.9.8-1.3-2.4-1.4V4.4z"/></svg>
          </button>
          <button class="timer-btn timer-pauze" aria-label="Pauzeer"></button>
          <button class="timer-btn timer-stop" aria-label="Stop">
            <svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
          </button>
        </div>`;
      timerStapel().appendChild(el);
      el.querySelector('.timer-pauze').addEventListener('click', () => pauzeerTimer(t.id));
      el.querySelector('.timer-stop').addEventListener('click', () => stopTimer(t.id));
      el.querySelector('.timer-klok').addEventListener('click', () => zetTimerInKlok(t.id));
      requestAnimationFrame(() => el.classList.add('zichtbaar'));
      return el;
    }

    function tekenTimer(t) {
      const el = balkVan(t.id);
      if (!el) return;
      el.querySelector('.timer-tijd').textContent = tijdTekst(t.resterend);
      el.querySelector('.timer-label').textContent = t.label;
      const ring = el.querySelector('.timer-ring__voortgang');
      const omtrek = 119.4;
      const deel = t.totaal ? t.resterend / t.totaal : 0;
      ring.style.strokeDashoffset = String(omtrek * (1 - deel));
      el.querySelector('.timer-pauze').innerHTML = t.loopt
        ? '<svg viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>'
        : '<svg viewBox="0 0 16 16"><path d="M4 3l9 5-9 5z"/></svg>';
      el.classList.toggle('afgelopen', t.resterend === 0 && t.totaal > 0);
    }

    function startTimer(seconden, label) {
      wekGeluid();                       // nu nog tijdens de tik; straks mag het niet meer
      // De timer in de pagina loopt alleen zolang het scherm aan staat en
      // Safari vooraan is. Daarom eenmalig wijzen op het klokje, dat hem
      // overdraagt aan de Klok-app — die loopt wél door en maakt geluid.
      try {
        if (!localStorage.getItem('klok_tip_gezien')) {
          localStorage.setItem('klok_tip_gezien', '1');
          setTimeout(() => toonToast('Scherm uit? Tik op het klokje — dan loopt hij door in de Klok-app.'), 900);
        }
      } catch {}

      // Dezelfde stap nog eens aantikken zet díé timer opnieuw. Hem stoppen en
      // een nieuwe maken gaf heel even twee gelijke balken naast elkaar.
      let t = timers.find(x => x.label === label);
      if (t) {
        Object.assign(t, { resterend: seconden, totaal: seconden, loopt: true });
      } else {
        t = { id: ++timerNr, resterend: seconden, totaal: seconden,
              label, loopt: true, tik: null };
        timers.push(t);
        maakBalk(t);
      }
      tekenTimer(t);
      laatLopen(t);
    }

    function laatLopen(t) {
      clearInterval(t.tik);
      t.tik = setInterval(() => {
        if (!t.loopt) return;
        t.resterend = Math.max(0, t.resterend - 1);
        tekenTimer(t);
        if (t.resterend === 0) {
          clearInterval(t.tik);
          t.loopt = false;
          piep();
          toonToast(`Timer klaar — ${t.label}`);
        }
      }, 1000);
    }

    // Draagt een lopende timer over aan de Klok-app. De timer in de pagina is
    // alleen betrouwbaar zolang het scherm aan staat en Safari vooraan is;
    // de Klok-app loopt door en geeft een melding.
    function zetTimerInKlok(id) {
      const t = timers.find(x => x.id === id);
      if (!t || !t.resterend) return;
      const naam = `${t.label} — ${recept.titel}`;
      const invoer = `${t.resterend}|${naam}`;
      window.location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_TIMER)}`
        + `&input=text&text=${encodeURIComponent(invoer)}`;
    }

    function pauzeerTimer(id) {
      const t = timers.find(x => x.id === id);
      if (!t || t.resterend === 0) return;
      t.loopt = !t.loopt;
      tekenTimer(t);
    }

    function stopTimer(id) {
      const t = timers.find(x => x.id === id);
      if (!t) return;
      clearInterval(t.tik);
      timers = timers.filter(x => x.id !== id);
      const el = balkVan(id);
      if (el) {
        el.classList.remove('zichtbaar');
        setTimeout(() => el.remove(), 400);
      }
    }

    // Kort geluid zonder extern bestand
    /* Safari laat geluid alleen toe als de AudioContext tijdens een tik is
       aangemaakt. Deden we dat pas bij het aflopen — vijfentwintig minuten
       later — dan startte hij 'suspended' en hoorde je niets. Daarom maken we
       hem bij het starten van de timer en houden we hem wakker. */
    let geluidCtx = null;

    function wekGeluid() {
      try {
        if (!geluidCtx) geluidCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (geluidCtx.state === 'suspended') geluidCtx.resume();
      } catch {}
    }

    function piep() {
      try {
        wekGeluid();
        const ctx = geluidCtx;
        if (!ctx) return;
        [0, 0.35, 0.7].forEach(vertraging => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.frequency.value = 880;
          osc.connect(gain); gain.connect(ctx.destination);
          const t = ctx.currentTime + vertraging;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
          osc.start(t); osc.stop(t + 0.3);
        });
      } catch {}
    }

    // Zoekt een tijdsaanduiding in een stap. Bij een bereik ("6-8 min") nemen
    // we de bovenkant: liever te lang wachten dan aangebrand.
    function secondenInTekst(tekst) {
      const m = tekst.match(/(\d+)\s*(?:-|–|\s*tot\s*)?\s*(\d+)?\s*(min(?:uut|uten)?|sec(?:onde|onden)?|uur)\b/i);
      if (!m) return 0;
      const waarde = parseInt(m[2] || m[1], 10);
      const eenheid = m[3].toLowerCase();
      const seconden = eenheid.startsWith('sec') ? waarde
                     : eenheid === 'uur' ? waarde * 3600
                     : waarde * 60;
      return (!seconden || seconden > 4 * 3600) ? 0 : seconden;
    }

    function stapMetTimer(tekst, nummer) {
      const seconden = secondenInTekst(tekst);
      if (!seconden) return '';
      return `<button class="stap-timer-knop" data-seconden="${seconden}" data-stap="${nummer}"
        aria-label="Timer van ${tijdTekst(seconden)} starten">${tijdTekst(seconden)}</button>`;
    }

    // Welke ingrediënten noemt deze stap? Vergelijkt op het kernwoord van de
    // ingrediëntnaam, zodat "2 preien, in ringetjes" ook matcht op "prei".
    function ingredientenVoorStap(stapTekst) {
      const tekst = stapTekst.toLowerCase();
      return recept.ingredienten.filter(ing => {
        const woorden = ing.naam.toLowerCase()
          .split(/[^a-zà-ÿ]+/)
          .filter(w => w.length > 3);
        return woorden.some(w => {
          const stam = w.length > 5 ? w.slice(0, -1) : w;   // meervoud opvangen
          return tekst.includes(stam);
        });
      });
    }

    // ── RENDER ──

    let ahProducten = {};

    function renderIngredient(ing, index) {
      const hoeveelheid = formatHoeveelheid(ing.hoeveelheid, huidigPorties, basisPorties, ing.eenheid);
      const eenheid = ing.eenheid === 'naar smaak' ? '' : ing.eenheid;
      const rechts = ing.eenheid === 'naar smaak'
        ? 'naar smaak'
        : `${hoeveelheid} ${eenheid}`.trim();
      const klikbaar = ing.hoeveelheid > 0 && ing.eenheid !== 'naar smaak'
        ? ' style="cursor:pointer" title="Klik om aan te passen"' : '';
      const product = ing.ah ? ahProducten[ing.ah] : null;
      const foto = ingredientVakje(ing.naam, product);
      // Prijzen horen in de winkel, niet bij het fornuis
      const ahRegel = product
        ? `<span class="ingredient-ah">${product.titel}${product.eenheid ? ' · ' + product.eenheid : ''}</span>`
        : '';
      return `<li data-ing-index="${index}">
        <button class="vink" data-i="${index}" aria-pressed="false" aria-label="Afvinken">
          <svg viewBox="0 0 24 24"><use href="#i-vink"/></svg></button>
        ${foto}
        <span class="ingredient-naam">${metHoofdletter(ing.naam)}${ahRegel}</span>
        <span class="ingredient-hoeveelheid"${klikbaar}>${rechts}</span>
      </li>`;
    }

    function renderRecept(r) {
      recept = r;
      basisPorties = r.porties;
      // Shar en Robin koken altijd voor twee dagen, dus vier porties. Recepten
      // staan vaak op twee; die worden standaard verdubbeld. Een taart of
      // pizzadeeg laten we met rust: die zit vast aan een vorm en halveren of
      // verdubbelen werkt daar niet. Zet je het zelf anders, dan onthoudt hij dat.
      const vasteVorm = (r.benodigdheden || [])
        .some(b => /springvorm|bakvorm|taartvorm|pizzasteen/i.test(b));
      const eigenKeuze = parseInt(localStorage.getItem(`porties_${r.id}`) || '', 10);
      huidigPorties = Number.isFinite(eigenKeuze) && eigenKeuze > 0
        ? eigenKeuze
        : (vasteVorm ? r.porties : STANDAARD_PORTIES);
      document.title = `${r.titel} — Onze Recepten`;

      // Dynamische OG meta tags
      function setMeta(attr, attrValue, content) {
        let el = document.querySelector(`meta[${attr}="${attrValue}"]`);
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, attrValue);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }
      setMeta('property', 'og:title', r.titel);
      setMeta('property', 'og:description', r.beschrijving || '');
        setMeta('name', 'description', r.beschrijving || '');
      setMeta('property', 'og:type', 'article');
      if (r.afbeelding) {
        // Open Graph wil een volledige url; een pad als img/recept/x.jpg
        // levert bij de meeste lezers niets op.
        setMeta('property', 'og:image', new URL(r.afbeelding, location.href).href);
      }

      const img = `
        <div class="hero-wrap">
          ${r.afbeelding
            ? `<img class="recept-hero" src="${r.afbeelding}" alt="">`
            : `<div class="recept-hero-placeholder"><span>${r.titel.trim()[0] || '?'}</span></div>`}
          <div class="hero-acties">
            <a class="rondknop" href="./index.html" aria-label="Terug">
              <svg class="ic" viewBox="0 0 24 24"><use href="#i-terug"/></svg></a>
            <span style="display:flex;gap:.5rem">
              <button class="rondknop" id="foto-btn"
                      aria-label="${r.afbeelding ? 'Foto vervangen' : 'Foto toevoegen'}"
                      title="${r.afbeelding ? 'Foto vervangen' : 'Foto toevoegen'}">
                <svg class="ic" viewBox="0 0 24 24"><use href="#i-camera"/></svg></button>
              <a class="rondknop" href="./winkel.html?id=${r.id}" aria-label="Wat heb ik nodig">
                <svg class="ic" viewBox="0 0 24 24"><use href="#i-mandje"/></svg></a>
            </span>
          </div>
          <input type="file" id="foto-invoer" accept="image/*" hidden>
          <div class="foto-status" id="foto-status" hidden></div>
        </div>`;

      // De foto nog eens, uitvergroot en vervaagd: daar komt de kleur van het
      // scherm vandaan in donkere modus. Echte pixels, geen verzonnen verloop.
      const echo = r.afbeelding
        ? `<div class="echo" aria-hidden="true"><img src="${r.afbeelding}" alt=""></div>`
        : '';

      const tags = r.tags.map(t => `<span class="tag">${metHoofdletter(t)}</span>`).join('');
      const ingredienten = r.ingredienten.map((ing, i) => renderIngredient(ing, i)).join('');
      const stappen = r.stappen.map(s => `
        <div class="stap" data-stap="${s.nummer}" role="button" tabindex="0" aria-label="Stap ${s.nummer}">
          <span class="stap-nummer">${s.nummer}</span>
          <p class="stap-tekst">${s.tekst}${stapMetTimer(s.tekst, s.nummer)}</p>
        </div>`).join('');

      const heeftVoeding = r.voedingswaarden && (r.voedingswaarden.kcal || r.voedingswaarden.eiwitten || r.voedingswaarden.koolhydraten || r.voedingswaarden.vetten);
      const voeding = heeftVoeding ? `
        <div class="voeding-sectie">
          <div class="blok-titel">Schatting per portie</div>
          <div class="voeding-grid">
            <div class="voeding-item">
              <span class="voeding-waarde">${r.voedingswaarden.kcal}</span>
              <span class="voeding-label">kcal</span>
            </div>
            <div class="voeding-item">
              <span class="voeding-waarde">${r.voedingswaarden.eiwitten}g</span>
              <span class="voeding-label">eiwit</span>
            </div>
            <div class="voeding-item">
              <span class="voeding-waarde">${r.voedingswaarden.koolhydraten}g</span>
              <span class="voeding-label">koolhydraten</span>
            </div>
            <div class="voeding-item">
              <span class="voeding-waarde">${r.voedingswaarden.vetten}g</span>
              <span class="voeding-label">vet</span>
            </div>
          </div>
        </div>` : '';

      // ── ONZE KEUKEN ──
      // Twee AEG-ovens, allebei hetelucht: de SteamPro (70 l, met stoom) en de
      // CombiQuick (43 l, met magnetron). Het programma-advies komt uit
      // Scripts/ovenprogramma.py en staat bewust níét in een bereidingsstap:
      // het is onze eigen aanbeveling, niet wat de bron voorschreef.
      const alleStappen = r.stappen.map(s => s.tekst).join(' ').toLowerCase();
      const keukenTips = [];
      if (r.ovenprogramma) {
        const groot = /braadslede|bakplaat/.test(alleStappen);
        keukenTips.push(r.ovenprogramma + (groot
          ? ' Een braadslede of bakplaat past alleen in de SteamPro (70 l).'
          : ''));
      }
      if (/koekenpan|hapjespan|sauteerpan|braadpan|grillpan|wok|steelpan|soeppan/.test(alleStappen)) {
        keukenTips.push('De Demeyere-pannen houden op inductie lang warmte vast; zet een stand lager zodra de pan op temperatuur is.');
      }
      const keuken = keukenTips.length ? `
        <div class="keuken-tip">
          <span class="keuken-tip__kop">Onze keuken</span>
          <span>${keukenTips.join(' ')}</span>
        </div>` : '';

      const benodigd = (r.benodigdheden && r.benodigdheden.length) ? `
        <div class="benodigd">
          <span class="benodigd__kop">Pak alvast</span>
          <span>${r.benodigdheden.map(metHoofdletter).join(' · ')}</span>
        </div>` : '';

      let bron = '';
      // Foto's onder een CC-licentie moeten de maker noemen
      if (r.foto_maker) {
        const wie = r.bron_afbeelding
          ? `<a class="bron-link" href="${r.bron_afbeelding}" target="_blank" rel="noopener">${r.foto_maker}</a>`
          : r.foto_maker;
        bron += `<span class="bron-label">Foto: ${wie}, ${r.foto_licentie || 'CC'}</span>`;
      }

      document.getElementById('app').innerHTML = `
        ${echo}
        ${img}
        <div class="recept-detail">
          <div class="recept-detail__header">
            <div class="recept-detail__titelrij">
              <h1 class="recept-detail__title">${r.titel}</h1>
            </div>
            <div class="recept-detail__meta">
              <span>${r.actieve_tijd ? r.actieve_tijd + ' min actief' : r.bereidingstijd + ' min'}</span>
              <span class="pip"></span>
              <span>${r.moeilijkheidsgraad}</span>
              ${r.passieve_tijd ? `<span class="pip"></span><span>${r.passieve_tijd} min oven</span>` : ''}
              ${r.bron_naam && r.bron_naam !== 'Handmatig' ? `<span class="pip"></span><span>${
                r.bron
                  ? `<a class="bron-link" href="${r.bron}" target="_blank" rel="noopener">${r.bron_naam}</a>`
                  : r.bron_naam}</span>` : ''}
            </div>
            <div class="gemaakt" id="gemaakt-regel">
              <svg class="ic klein" viewBox="0 0 24 24"><use href="#i-vink"/></svg>
              <span>${gemaaktLangeTekst(r.id)}</span>
              ${hartKnop(r.id, 'hart-btn--detail')}
            </div>
            <div class="recept-detail__tags">${tags}</div>
          </div>

          <div class="fase-balk">
            <div class="fase-tabs" role="tablist">
              <span class="fase-tabs__pil" id="fase-pil"></span>
              <button class="fase-tab" role="tab" data-fase="ingredienten" aria-selected="true"
                      aria-controls="paneel-ingredienten"><span class="fase-tab__label">Ingrediënten</span><span class="fase-tab__badge" id="badge-ingredienten"></span></button>
              <button class="fase-tab" role="tab" data-fase="bereiding" aria-selected="false"
                      aria-controls="paneel-bereiding"><span class="fase-tab__label">Bereiding</span><span class="fase-tab__badge" id="badge-bereiding"></span></button>
            </div>
          </div>

          ${r.tags.includes('babyvriendelijk') ? `
          <div class="mae-melding" id="mae-melding" hidden>
            <span class="mae-melding__kop">Mae modus aan</span>
            <span>Schep haar portie apart vóór de gemarkeerde stappen. Wat zij niet
            meekrijgt staat bij de ingrediënten aangegeven.</span>
          </div>` : ''}

          <div class="fase-paneel" id="paneel-ingredienten" role="tabpanel">
            <div class="portie-schaler">
              <label>Porties</label>
              <button class="portie-btn" id="min-btn" aria-label="Minder porties"><svg class="ic klein" viewBox="0 0 24 24"><use href="#i-min"/></svg></button>
              <span class="portie-aantal">${huidigPorties}</span>
              <button class="portie-btn" id="plus-btn" aria-label="Meer porties"><svg class="ic klein" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
              ${r.tags.includes('babyvriendelijk')
                ? `<button class="mae-schakel" id="mae-schakel" aria-pressed="false">Mae modus</button>`
                : ''}
            </div>
            <div class="ingredienten-blok">
              <ul class="ingredienten-lijst">${ingredienten}</ul>
              <button class="boodschappen-btn" id="boodschappen-btn">Zet op boodschappenlijst</button>
            </div>
            ${voeding}
          </div>

          <div class="fase-paneel" id="paneel-bereiding" role="tabpanel" hidden>
            ${benodigd}
            ${keuken}
            <div class="stappen-blok">
              <button class="kookmodus-btn" id="kookmodus-btn">Start kookmodus</button>
              ${stappen}
            </div>
          </div>

          <div class="recept-voet">
            ${bron}
            <button class="print-btn" id="print-btn">Print recept</button>
            <button class="verwijder-btn" id="verwijder-btn">Verwijder dit recept</button>
            <p class="verwijder-uitleg" id="verwijder-uitleg" hidden></p>
          </div>

        </div>`;

      // Portie knoppen
      const onthoudPorties = () => {
        try { localStorage.setItem(`porties_${r.id}`, String(huidigPorties)); } catch {}
      };
      document.getElementById('min-btn').addEventListener('click', () => {
        if (huidigPorties > 1) { huidigPorties--; updateIngredientHoeveelheden(); onthoudPorties(); }
      });
      document.getElementById('plus-btn').addEventListener('click', () => {
        huidigPorties++;
        updateIngredientHoeveelheden();
        onthoudPorties();
      });

      // ── MAE MODUS ──
      // Mae eet mee, maar zout en pittige kruiden nog niet. Deze schakelaar
      // markeert precies de stappen waarvoor je haar portie apart moet scheppen.
      const maeSchakel = document.getElementById('mae-schakel');
      if (maeSchakel) {
        const maeSleutel = `mae_${r.id}`;
        let maeAan = localStorage.getItem(maeSleutel) === 'true';
        // Op smaak brengen: schep haar portie eruit vóór deze stap.
        const PITTIG = /\bzout|peper|kruiden|chili|harissa|sojasaus|ketjap|tabasco|sambal|cayenne|paprikapoeder|mosterd|za'?atar|shoarma|ras el hanout|miso|currypasta|kerrie|bouillon/i;
        // Een ander soort 'niet voor Mae': dit laat je gewoon van haar bordje weg.
        const WEGLATEN = /honing|walnoot|walnoten|hazelnoot|hazelnoten|amandel|amandelen|cashew|pinda|pistache|pijnboompitten/i;

        function tekenMae() {
          maeSchakel.setAttribute('aria-pressed', String(maeAan));
          maeSchakel.classList.toggle('mae-schakel--aan', maeAan);
          const melding = document.getElementById('mae-melding');
          if (melding) melding.hidden = !maeAan;

          document.querySelectorAll('.stap').forEach(stap => {
            stap.querySelector('.mae-tip')?.remove();
            stap.classList.remove('stap--mae');
            const tekst = stap.querySelector('.stap-tekst')?.textContent || '';
            if (maeAan && PITTIG.test(tekst)) {
              stap.classList.add('stap--mae');
              const tip = document.createElement('p');
              tip.className = 'mae-tip';
              tip.textContent = 'Schep Mae’s portie apart vóór deze stap';
              stap.appendChild(tip);
            }
          });

          // Via data-i, niet via de positie in de lijst: die kan verschuiven.
          document.querySelectorAll('.ingredienten-lijst li').forEach(li => {
            li.querySelector('.mae-skip')?.remove();
            const i = li.querySelector('.vink')?.dataset.i;
            const naam = (i != null && r.ingredienten[i]) ? r.ingredienten[i].naam : '';
            if (maeAan && (PITTIG.test(naam) || WEGLATEN.test(naam))) {
              const skip = document.createElement('span');
              skip.className = 'mae-skip';
              skip.textContent = WEGLATEN.test(naam)
                ? 'laat weg voor Mae'
                : 'niet voor Mae';
              li.appendChild(skip);
            }
          });
        }

        maeSchakel.addEventListener('click', () => {
          maeAan = !maeAan;
          localStorage.setItem(maeSleutel, String(maeAan));
          tekenMae();
        });
        if (maeAan) tekenMae();
      }

      // Kookmodus knop
      document.getElementById('kookmodus-btn').addEventListener('click', openKookmodus);

      // Boodschappenlijst knop
      document.getElementById('boodschappen-btn').addEventListener('click', zetOpBoodschappenlijst);

      // Print knop
      document.getElementById('print-btn').addEventListener('click', () => window.print());

      // Verwijderen
      document.getElementById('verwijder-btn').addEventListener('click', vraagVerwijderen);

      // Foto toevoegen of vervangen
      const fotoBtn = document.getElementById('foto-btn');
      const fotoInvoer = document.getElementById('foto-invoer');
      fotoBtn.addEventListener('click', () => {
        if (!heeftToken()) {
          const status = document.getElementById('foto-status');
          status.hidden = false;
          status.textContent = 'Eenmalig een GitHub-token nodig om een foto te bewaren.';
          vraagToken(status, () => fotoInvoer.click());
          return;
        }
        fotoInvoer.click();
      });
      fotoInvoer.addEventListener('change', verwerkFoto);

      // Fase-tabs, hartje en de timerknoppen in de stappen
      zetFaseTabsOp();
      koppelHart(document.querySelector('.hart-btn'));
      document.querySelectorAll('.stap-timer-knop').forEach(knop => {
        knop.addEventListener('click', e => {
          e.stopPropagation();          // niet meteen de stap afvinken
          startTimer(+knop.dataset.seconden, `Stap ${knop.dataset.stap}`);
        });
      });

      // Ingrediënt: klik op naam = afvinken, klik op hoeveelheid = aanpassen
      document.querySelectorAll('.ingredienten-lijst li').forEach((li, i) => {
        const vink = li.querySelector('.vink');
        if (vink) vink.addEventListener('click', e => { e.stopPropagation(); toggleIngredient(i); });
        const naam = li.querySelector('.ingredient-naam');
        const hoeveelheid = li.querySelector('.ingredient-hoeveelheid');
        if (naam) naam.addEventListener('click', (e) => { e.stopPropagation(); toggleIngredient(i); });
        if (hoeveelheid && recept.ingredienten[i].hoeveelheid > 0) {
          hoeveelheid.addEventListener('click', (e) => { e.stopPropagation(); startIngredientEdit(li, i); });
        }
      });
      herstelIngredienten();

      // Stap afvinken
      document.querySelectorAll('.stap').forEach(el => {
        el.addEventListener('click', () => toggleStap(+el.dataset.stap));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') toggleStap(+el.dataset.stap);
        });
      });
      herstelStappen();
    }

    async function init() {
      const id = getParam('id');
      if (!id) { toonNietGevonden(); return; }

      const [res, ahRes] = await Promise.all([
        fetch('./data/recepten.json', { cache: 'no-cache' }),
        fetch('./data/ah-producten.json', { cache: 'no-cache' }).catch(() => null),
      ]);
      const data = await res.json();
      // Productfoto's zijn een extra: zonder AH-data werkt de pagina gewoon
      if (ahRes && ahRes.ok) ahProducten = await ahRes.json().catch(() => ({}));
      const r = data.recepten.find(r => r.id === id);

      if (!r) { toonNietGevonden(); return; }
      renderRecept(r);
    }

    function toonNietGevonden() {
      document.getElementById('app').innerHTML = `
        <div class="not-found">
          <h2>Recept niet gevonden</h2>
          <p><a href="./index.html">Terug naar overzicht</a></p>
        </div>`;
    }

    // Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    init();
  </script>

</body>
</html>
