<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1A18">
  <meta property="og:title" content="Recepten">
  <meta property="og:description" content="Persoonlijke receptenverzameling">
  <meta property="og:type" content="website">
  <meta name="description" content="Persoonlijke receptenverzameling">
  <title>Recepten</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./img/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" title="Wissel thema">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <main class="container">
    <header class="page-header">
      <h1 class="page-title">Recepten</h1>
    </header>
    <div class="search-bar">
      <input type="search" id="zoekbalk" placeholder="Zoek op recept of ingrediënt…" autocomplete="off">
      <select id="sorteer" class="sorteer-select">
        <option value="nieuwste">Nieuwste eerst</option>
        <option value="az">A–Z</option>
        <option value="snelste">Snelste eerst</option>
      </select>
      <a href="./import.html" class="toevoeg-btn">+ Recept</a>
    </div>

    <div class="tag-filters" id="tag-filters"></div>

    <div class="recepten-grid" id="recepten-grid"></div>
  </main>

  <nav class="bottom-tab-bar">
    <a href="./index.html" class="tab-bar-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10a1 1 0 0 1 .4-.8l7-5.25a1 1 0 0 1 1.2 0l7 5.25a1 1 0 0 1 .4.8v9a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4h-4v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
      <span>Recepten</span>
    </a>
    <a href="./import.html" class="tab-bar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Toevoegen</span>
    </a>
  </nav>

  <script>
    const ALLE_TAGS = [
      'vegetarisch', 'vegan', 'vis', 'vlees',
      'snel', 'comfort food',
      'Aziatisch', 'Italiaans',
      'ontbijt', 'brunch', 'lunch', 'diner', 'snack'
    ];

    let alleRecepten = [];
    let actiefTag = null;
    let zoekterm = '';
    let sorteerOptie = 'nieuwste';
    let filterInHuis = false;

    const BAG_ICON   = `<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="5" width="10" height="8" rx="1.5"/><path d="M5 5V3.5a2 2 0 0 1 4 0V5"/></svg>`;
    const CHECK_ICON = `<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,7 5.5,10.5 12,3.5"/></svg>`;

    function getInHuis() {
      try { return JSON.parse(localStorage.getItem('in_huis') || '[]'); } catch { return []; }
    }
    function toggleInHuis(id) {
      const lijst = getInHuis();
      const idx = lijst.indexOf(id);
      if (idx === -1) lijst.push(id); else lijst.splice(idx, 1);
      localStorage.setItem('in_huis', JSON.stringify(lijst));
    }

    function toonSkeletons() {
      const skelet = `
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--meta"></div>
            <div class="skeleton-line skeleton-line--tags"></div>
          </div>
        </div>`;
      document.getElementById('recepten-grid').innerHTML = Array(6).fill(skelet).join('');
    }

    async function laadRecepten() {
      try {
        const res = await fetch('./data/recepten.json');
        if (!res.ok) throw new Error();
        const data = await res.json();
        alleRecepten = data.recepten;
        renderTags();
        renderRecepten();
      } catch {
        document.getElementById('recepten-grid').innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">⚠</div>
            <p>Kon recepten niet laden</p>
            <p class="empty-state__sub">Controleer je internetverbinding en ververs de pagina</p>
          </div>`;
      }
    }

    function renderTags() {
      const container = document.getElementById('tag-filters');
      const inHuisLijst = getInHuis();
      const inHuisAantal = alleRecepten.filter(r => inHuisLijst.includes(r.id)).length;

      const inHuisBtn = inHuisAantal > 0 || filterInHuis
        ? `<button class="tag-btn${filterInHuis ? ' active' : ''}" id="in-huis-filter-btn">✓ in huis (${inHuisAantal})</button>`
        : '';

      const tags = ALLE_TAGS
        .filter(tag => alleRecepten.some(r => (r.tags || []).includes(tag)))
        .map(tag => `<button class="tag-btn${actiefTag === tag ? ' active' : ''}" data-tag="${tag}">${tag}</button>`)
        .join('');

      container.innerHTML = inHuisBtn + tags;

      document.getElementById('in-huis-filter-btn')?.addEventListener('click', () => {
        filterInHuis = !filterInHuis;
        if (filterInHuis) actiefTag = null;
        renderTags();
        renderRecepten();
      });

      container.querySelectorAll('.tag-btn[data-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
          actiefTag = actiefTag === btn.dataset.tag ? null : btn.dataset.tag;
          if (actiefTag) filterInHuis = false;
          renderTags();
          renderRecepten();
        });
      });
    }

    function zoekMatch(r, term) {
      if (r.titel.toLowerCase().includes(term)) return true;
      if ((r.ingredienten || []).some(ing => ing.naam.toLowerCase().includes(term))) return true;
      return false;
    }

    function renderRecepten() {
      const grid = document.getElementById('recepten-grid');
      let resultaat = [...alleRecepten];

      if (filterInHuis) {
        const inHuisLijst = getInHuis();
        resultaat = resultaat.filter(r => inHuisLijst.includes(r.id));
      }
      if (actiefTag) {
        resultaat = resultaat.filter(r => (r.tags || []).includes(actiefTag));
      }
      if (zoekterm) {
        const term = zoekterm.toLowerCase();
        resultaat = resultaat.filter(r => zoekMatch(r, term));
      }

      // Sortering
      if (sorteerOptie === 'nieuwste') {
        resultaat.sort((a, b) => (b.datum_toegevoegd || '').localeCompare(a.datum_toegevoegd || ''));
      } else if (sorteerOptie === 'az') {
        resultaat.sort((a, b) => a.titel.localeCompare(b.titel, 'nl'));
      } else if (sorteerOptie === 'snelste') {
        resultaat.sort((a, b) => (a.actieve_tijd || a.bereidingstijd || 0) - (b.actieve_tijd || b.bereidingstijd || 0));
      }

      if (resultaat.length === 0) {
        const label = zoekterm ? `"${zoekterm}"` : actiefTag ? `#${actiefTag}` : '';
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">◌</div>
            <p>${label ? `Niets gevonden voor ${label}` : 'Geen recepten gevonden.'}</p>
            ${label ? `<p class="empty-state__sub">Probeer een andere zoekterm of filter</p>` : ''}
          </div>`;
        return;
      }

      grid.innerHTML = resultaat.map(r => {
        const phKlasse = r.tags.includes('vlees') ? 'ph--vlees'
          : r.tags.includes('vis') ? 'ph--vis'
          : (r.tags.includes('vegetarisch') || r.tags.includes('vegan')) ? 'ph--groen'
          : r.tags.includes('ontbijt') ? 'ph--geel'
          : '';
        const isInHuis = getInHuis().includes(r.id);
        const inHuisKnop = `<button class="in-huis-btn${isInHuis ? ' actief' : ''}" data-id="${r.id}" title="${isInHuis ? 'Ingrediënten in huis — klik om te verwijderen' : 'Ingrediënten in huis markeren'}">${isInHuis ? CHECK_ICON : BAG_ICON}</button>`;
        const imgWrap = r.afbeelding
          ? `<div style="position:relative"><img class="recept-card__img" src="${r.afbeelding}" alt="${r.titel}" loading="lazy">${inHuisKnop}</div>`
          : `<div style="position:relative"><div class="recept-card__img-placeholder ${phKlasse}"></div>${inHuisKnop}</div>`;

        const tags = r.tags.map(t => `<span class="tag">${t}</span>`).join('');

        // Toon welke ingrediënten matchen als er gezocht wordt
        let matchLabel = '';
        if (zoekterm && !r.titel.toLowerCase().includes(zoekterm.toLowerCase())) {
          const term = zoekterm.toLowerCase();
          const matches = r.ingredienten
            .filter(ing => ing.naam.toLowerCase().includes(term))
            .map(ing => ing.naam);
          if (matches.length) {
            matchLabel = `<div class="recept-card__match">bevat ${matches.slice(0, 2).join(', ')}</div>`;
          }
        }

        const beschrijving = r.beschrijving
          ? `<div class="recept-card__beschrijving">${r.beschrijving}</div>`
          : '';

        const bronNaam = r.bron_naam && r.bron_naam !== 'Handmatig'
          ? `<div class="recept-card__bron">${r.bron_naam}</div>`
          : '';

        return `
          <a class="recept-card${isInHuis ? ' card--in-huis' : ''}" href="./recept.html?id=${r.id}">
            ${imgWrap}
            <div class="recept-card__body">
              <div class="recept-card__title">${r.titel}</div>
              ${beschrijving}
              ${bronNaam}
              ${matchLabel}
              <div class="recept-card__meta">
                <span>${r.actieve_tijd ? r.actieve_tijd + ' min actief' : (r.bereidingstijd ? r.bereidingstijd + ' min' : '')}${r.passieve_tijd ? ' + ' + r.passieve_tijd + ' wachten' : ''}</span>
                <span class="recept-card__meta-sep"></span>
                <span>${r.moeilijkheidsgraad}</span>
                <span class="recept-card__meta-sep"></span>
                <span>${r.porties} porties</span>
              </div>
              <div class="recept-card__tags">${tags}</div>
            </div>
          </a>`;
      }).join('');
    }

    document.getElementById('recepten-grid').addEventListener('click', e => {
      const btn = e.target.closest('.in-huis-btn');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.id;
      toggleInHuis(id);
      const actief = getInHuis().includes(id);
      btn.classList.toggle('actief', actief);
      btn.innerHTML = actief ? CHECK_ICON : BAG_ICON;
      btn.closest('.recept-card')?.classList.toggle('card--in-huis', actief);
      renderTags(); // update "in huis (n)" teller
      if (filterInHuis) renderRecepten(); // herfilter als filter actief
    });

    let zoekTimeout;
    document.getElementById('zoekbalk').addEventListener('input', e => {
      zoekterm = e.target.value.trim();
      clearTimeout(zoekTimeout);
      zoekTimeout = setTimeout(renderRecepten, 150);
    });

    document.getElementById('sorteer').addEventListener('change', e => {
      sorteerOptie = e.target.value;
      renderRecepten();
    });

    // Theme toggle
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    toonSkeletons();
    laadRecepten();
  </script>

</body>
</html>
