<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Persoonlijke receptenverzameling van Shar &amp; Robin">
  <meta property="og:title" content="Onze Recepten">
  <meta property="og:description" content="Persoonlijke receptenverzameling van Shar &amp; Robin">
  <meta property="og:type" content="website">
  <title>Onze Recepten</title>
  <link rel="stylesheet" href="./css/style.css?v=226917">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-boek"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></g>
  <g id="i-mand"><path d="M4.5 9h15l-1.4 9.2a2 2 0 0 1-2 1.8H7.9a2 2 0 0 1-2-1.8z"/><path d="M8.5 9l2.2-4.6M15.5 9l-2.2-4.6"/></g>
  <g id="i-hart"><path d="M12 20s-7.5-4.7-7.5-10A4.2 4.2 0 0 1 8.7 6c1.4 0 2.6.7 3.3 1.9C12.7 6.7 13.9 6 15.3 6a4.2 4.2 0 0 1 4.2 4c0 5.3-7.5 10-7.5 10z"/></g>
  <g id="i-zoek"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></g>
  <g id="i-plus"><path d="M12 7v10M7 12h10"/></g>
</defs></svg>

  <header class="site-header">
    <div>
      <h1 class="grote-titel" id="kop-titel">Recepten</h1>
      <p class="ondertitel" id="recept-teller"></p>
    </div>
    <a class="rondknop" href="./import.html" aria-label="Recept toevoegen">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
    </a>
  </header>

  <main class="container">
    <div class="search-bar">
      <label class="zoekveld">
        <svg class="ic klein" viewBox="0 0 24 24"><use href="#i-zoek"/></svg>
        <input type="search" id="zoekbalk" placeholder="Zoek op recept of ingrediënt" autocomplete="off">
      </label>
    </div>
    <div class="tag-filters" id="tag-filters"></div>
    <div class="recepten-grid" id="recepten-grid"></div>
  </main>

  <nav class="tabbalk" aria-label="Hoofdnavigatie">
    <a class="tab" href="./index.html" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-boek"/></svg><em>Recepten</em></a>
    <a class="tab" href="./winkel.html">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-mand"/></svg><em>Winkel</em></a>
    <a class="tab" href="./index.html?favoriet=1">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-hart"/></svg><em>Favorieten</em></a>
  </nav>

  <script src="./js/gedeeld.js?v=226917"></script>
  <script>
    const ALLE_TAGS = ['vegetarisch','vegan','vis','vlees','snel','comfort food',
                       'Aziatisch','Italiaans','ontbijt','lunch','diner','snack'];

    let alleRecepten = [];
    let actiefTag = null;
    let zoekterm = '';
    let alleenFavorieten = new URLSearchParams(location.search).get('favoriet') === '1';
    let kookfilter = null;          // 'werk' | 'vaak' | 'nooit' | null

    /* Weinig werk: hooguit een kwartier snijden, en daarna doet de oven of de
       koelkast het. Dat is de reden om voor een traybake te kiezen. */
    function weinigWerk(r) {
      return (r.actieve_tijd || 99) <= 15 && (r.passieve_tijd || 0) >= 15;
    }

    async function laadRecepten() {
      const res = await fetch('./data/recepten.json', { cache: 'no-cache' });
      alleRecepten = (await res.json()).recepten;
      if (alleenFavorieten) {
        document.getElementById('kop-titel').textContent = 'Favorieten';
        document.querySelectorAll('.tab').forEach(t =>
          t.removeAttribute('aria-current'));
        document.querySelectorAll('.tab')[2].setAttribute('aria-current', 'page');
      }
      renderTags();
      renderRecepten();
    }

    function renderTags() {
      const c = document.getElementById('tag-filters');
      const chips = [
        { id: 'werk',  label: 'Weinig werk',  aan: kookfilter === 'werk' },
        { id: 'vaak',  label: 'Vaak gemaakt',  aan: kookfilter === 'vaak' },
        { id: 'nooit', label: 'Nog niet gemaakt', aan: kookfilter === 'nooit' },
      ].map(x => `<button class="tag-btn${x.aan ? ' active' : ''}" data-kook="${x.id}">${x.label}</button>`);

      const tags = ALLE_TAGS
        .filter(t => alleRecepten.some(r => r.tags.includes(t)))
        .map(t => `<button class="tag-btn${actiefTag === t ? ' active' : ''}" data-tag="${t}">${metHoofdletter(t)}</button>`);

      c.innerHTML = chips.join('') + tags.join('');
      c.querySelectorAll('.tag-btn').forEach(b => b.addEventListener('click', () => {
        if (b.dataset.kook) {
          kookfilter = kookfilter === b.dataset.kook ? null : b.dataset.kook;
        } else {
          actiefTag = actiefTag === b.dataset.tag ? null : b.dataset.tag;
        }
        renderTags(); renderRecepten();
      }));
    }

    /* Zoeken op 'ui' gaf 43 van de 52 recepten, want 'ui' zit ook in bouillon,
       kristalsuiker en linguine. En 'ei' in kwaliteit en kleingehakt.
       Daarom: korte termen moeten aan het begin van een woord staan. Vanaf
       vier letters mag het ook middenin, want dan zoek je meestal op een
       samenstelling — 'kool' hoort boerenkool en bloemkool te vinden. */
    function zoekMatch(r, term) {
      const woordBegin = new RegExp('(^|[^a-zà-ÿ])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
      const raak = (tekst) => term.length >= 4
        ? tekst.toLowerCase().includes(term)
        : woordBegin.test(tekst);
      return raak(r.titel) || r.ingredienten.some(i => raak(i.naam));
    }

    function renderRecepten() {
      const grid = document.getElementById('recepten-grid');
      let lijst = [...alleRecepten];

      if (alleenFavorieten) {
        const fav = laadFavorieten();
        lijst = lijst.filter(r => fav.includes(r.id));
      }
      if (kookfilter === 'werk')  lijst = lijst.filter(weinigWerk);
      if (kookfilter === 'vaak')  lijst = lijst.filter(r => aantalGemaakt(r.id) > 0);
      if (kookfilter === 'nooit') lijst = lijst.filter(r => aantalGemaakt(r.id) === 0);
      if (actiefTag) lijst = lijst.filter(r => r.tags.includes(actiefTag));
      if (zoekterm) lijst = lijst.filter(r => zoekMatch(r, zoekterm.toLowerCase()));

      // Wat je vaak maakt hoort bovenaan; daarna wat het laatst is toegevoegd
      lijst.sort((a, b) => aantalGemaakt(b.id) - aantalGemaakt(a.id)
                        || (b.datum_toegevoegd || '').localeCompare(a.datum_toegevoegd || ''));

      document.getElementById('recept-teller').textContent =
        lijst.length === alleRecepten.length
          ? `${lijst.length} recepten`
          : `${lijst.length} van ${alleRecepten.length} recepten`;

      if (!lijst.length) {
        grid.innerHTML = `<div class="empty-state">${
          alleenFavorieten ? 'Nog geen favorieten. Tik op een hartje om er een toe te voegen.'
                           : 'Geen recepten gevonden.'}</div>`;
        return;
      }

      const fav = laadFavorieten();
      grid.innerHTML = lijst.map(r => {
        // Het overzicht gebruikt de kleine versie uit img/kaart: een kaartje is
        // 171px breed, de grote foto 1400px. Scheelt zeventig procent over
        // mobiel internet. Bestaat die niet, dan valt hij terug op de grote.
        const kaartFoto = r.afbeelding && !r.afbeelding.startsWith('http')
          ? r.afbeelding.replace('img/recept/', 'img/kaart/')
          : r.afbeelding;
        const img = r.afbeelding
          ? `<img class="recept-card__img" src="${kaartFoto}" alt="" loading="lazy"
                  onerror="this.onerror=null;this.src='${r.afbeelding}'">`
          : `<div class="recept-card__img-placeholder"><span>${r.titel.trim()[0] || '?'}</span></div>`;
        const aan = fav.includes(r.id);
        // Normaal is de totale tijd het getal waar je op plant. Maar bij een
        // traybake kies je juist op hoe lang je zélf bezig bent — de rest
        // staat in de oven. Dan noemen we allebei.
        const totaal = r.bereidingstijd || r.actieve_tijd;
        const tijd = weinigWerk(r)
          ? `${r.actieve_tijd} min werk · ${totaal} min`
          : `${totaal} min`;
        const gemaakt = aantalGemaakt(r.id) ? ` · ${gemaaktTekst(r.id)}` : '';
        return `
          <a class="recept-card" href="./recept.html?id=${r.id}">
            ${img}
            <button class="hart-btn" data-recept="${r.id}" aria-pressed="${aan}"
                    aria-label="${aan ? 'Uit favorieten' : 'Aan favorieten'}">
              <svg viewBox="0 0 24 24"><use href="#i-hart"/></svg></button>
            <span class="recept-card__title">${r.titel}</span>
            <span class="recept-card__meta">${tijd}${gemaakt}</span>
          </a>`;
      }).join('');

      grid.querySelectorAll('.hart-btn').forEach(k => k.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const aan = wisselFavoriet(k.dataset.recept);
        k.setAttribute('aria-pressed', String(aan));
        if (alleenFavorieten) renderRecepten();
      }));
    }

    document.getElementById('zoekbalk').addEventListener('input', e => {
      zoekterm = e.target.value.trim();
      renderRecepten();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    laadRecepten();
  </script>
</body>
</html>
