<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta property="og:title" content="Onze Recepten">
  <meta property="og:description" content="Persoonlijke receptenverzameling van Shar & Robin">
  <meta property="og:type" content="website">
  <meta name="description" content="Persoonlijke receptenverzameling van Shar & Robin">
  <title>Onze Recepten</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <main class="container">
    <header class="page-header">
      <h1 class="page-title">Onze Recepten</h1>
      <p class="page-sub">Shar &amp; Robin</p>
    </header>
    <div class="search-bar">
      <input type="search" id="zoekbalk" placeholder="Zoek op recept of ingrediënt…" autocomplete="off">
      <select id="sorteer" class="sorteer-select">
        <option value="nieuwste">Nieuwste eerst</option>
        <option value="az">A–Z</option>
        <option value="snelste">Snelste eerst</option>
      </select>
      <a href="./import.html" class="toevoeg-btn">+ Recept</a>
    </div>

    <div class="tag-filters" id="tag-filters"></div>

    <div class="recepten-grid" id="recepten-grid"></div>
  </main>

  <script>
    const ALLE_TAGS = [
      'vegetarisch', 'vegan', 'vis', 'vlees',
      'snel', 'comfort food',
      'Aziatisch', 'Italiaans',
      'ontbijt', 'lunch', 'diner', 'snack'
    ];

    let alleRecepten = [];
    let actiefTag = null;
    let zoekterm = '';
    let sorteerOptie = 'nieuwste';

    function toonSkeletons() {
      const skelet = `
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-line--short"></div>
            <div class="skeleton-line skeleton-line--meta"></div>
            <div class="skeleton-line skeleton-line--tags"></div>
          </div>
        </div>`;
      document.getElementById('recepten-grid').innerHTML = Array(6).fill(skelet).join('');
    }

    async function laadRecepten() {
      const res = await fetch('./data/recepten.json');
      const data = await res.json();
      alleRecepten = data.recepten;
      renderTags();
      renderRecepten();
    }

    function renderTags() {
      const container = document.getElementById('tag-filters');
      container.innerHTML = ALLE_TAGS
        .filter(tag => alleRecepten.some(r => r.tags.includes(tag)))
        .map(tag => `<button class="tag-btn${actiefTag === tag ? ' active' : ''}" data-tag="${tag}">${tag}</button>`)
        .join('');

      container.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          actiefTag = actiefTag === btn.dataset.tag ? null : btn.dataset.tag;
          renderTags();
          renderRecepten();
        });
      });
    }

    function zoekMatch(r, term) {
      if (r.titel.toLowerCase().includes(term)) return true;
      if (r.ingredienten.some(ing => ing.naam.toLowerCase().includes(term))) return true;
      return false;
    }

    function renderRecepten() {
      const grid = document.getElementById('recepten-grid');
      let resultaat = alleRecepten;

      if (actiefTag) {
        resultaat = resultaat.filter(r => r.tags.includes(actiefTag));
      }
      if (zoekterm) {
        const term = zoekterm.toLowerCase();
        resultaat = resultaat.filter(r => zoekMatch(r, term));
      }

      // Sortering
      if (sorteerOptie === 'nieuwste') {
        resultaat.sort((a, b) => (b.datum_toegevoegd || '').localeCompare(a.datum_toegevoegd || ''));
      } else if (sorteerOptie === 'az') {
        resultaat.sort((a, b) => a.titel.localeCompare(b.titel, 'nl'));
      } else if (sorteerOptie === 'snelste') {
        resultaat.sort((a, b) => (a.actieve_tijd || a.bereidingstijd || 0) - (b.actieve_tijd || b.bereidingstijd || 0));
      }

      if (resultaat.length === 0) {
        const label = zoekterm ? `"${zoekterm}"` : actiefTag ? `#${actiefTag}` : '';
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">◌</div>
            <p>${label ? `Niets gevonden voor ${label}` : 'Geen recepten gevonden.'}</p>
            ${label ? `<p class="empty-state__sub">Probeer een andere zoekterm of filter</p>` : ''}
          </div>`;
        return;
      }

      grid.innerHTML = resultaat.map(r => {
        const phKlasse = r.tags.includes('vlees') ? 'ph--vlees'
          : r.tags.includes('vis') ? 'ph--vis'
          : (r.tags.includes('vegetarisch') || r.tags.includes('vegan')) ? 'ph--groen'
          : r.tags.includes('ontbijt') ? 'ph--geel'
          : '';
        const img = r.afbeelding
          ? `<img class="recept-card__img" src="${r.afbeelding}" alt="${r.titel}" loading="lazy">`
          : `<div class="recept-card__img-placeholder ${phKlasse}"></div>`;

        const tags = r.tags.map(t => `<span class="tag">${t}</span>`).join('');

        // Toon welke ingrediënten matchen als er gezocht wordt
        let matchLabel = '';
        if (zoekterm && !r.titel.toLowerCase().includes(zoekterm.toLowerCase())) {
          const term = zoekterm.toLowerCase();
          const matches = r.ingredienten
            .filter(ing => ing.naam.toLowerCase().includes(term))
            .map(ing => ing.naam);
          if (matches.length) {
            matchLabel = `<div class="recept-card__match">bevat ${matches.slice(0, 2).join(', ')}</div>`;
          }
        }

        const beschrijving = r.beschrijving
          ? `<div class="recept-card__beschrijving">${r.beschrijving}</div>`
          : '';

        const bronNaam = r.bron_naam && r.bron_naam !== 'Handmatig'
          ? `<div class="recept-card__bron">${r.bron_naam}</div>`
          : '';

        return `
          <a class="recept-card" href="./recept.html?id=${r.id}">
            ${img}
            <div class="recept-card__body">
              <div class="recept-card__title">${r.titel}</div>
              ${beschrijving}
              ${bronNaam}
              ${matchLabel}
              <div class="recept-card__meta">
                <span>${r.actieve_tijd ? r.actieve_tijd + ' min actief' : r.bereidingstijd + ' min'}${r.passieve_tijd ? ' + ' + r.passieve_tijd + ' wachten' : ''}</span>
                <span class="recept-card__meta-sep"></span>
                <span>${r.moeilijkheidsgraad}</span>
                <span class="recept-card__meta-sep"></span>
                <span>${r.porties} porties</span>
              </div>
              <div class="recept-card__tags">${tags}</div>
            </div>
          </a>`;
      }).join('');
    }

    document.getElementById('zoekbalk').addEventListener('input', e => {
      zoekterm = e.target.value.trim();
      renderRecepten();
    });

    document.getElementById('sorteer').addEventListener('change', e => {
      sorteerOptie = e.target.value;
      renderRecepten();
    });

    // Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    toonSkeletons();
    laadRecepten();
  </script>

</body>
</html>
