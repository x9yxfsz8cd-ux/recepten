<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: dark)">
  <title>In de winkel</title>
  <link rel="stylesheet" href="./css/style.css?v=311950">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-boek"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></g>
  <g id="i-mand"><path d="M4.5 9h15l-1.4 9.2a2 2 0 0 1-2 1.8H7.9a2 2 0 0 1-2-1.8z"/><path d="M8.5 9l2.2-4.6M15.5 9l-2.2-4.6"/></g>
  <g id="i-hart"><path d="M12 20s-7.5-4.7-7.5-10A4.2 4.2 0 0 1 8.7 6c1.4 0 2.6.7 3.3 1.9C12.7 6.7 13.9 6 15.3 6a4.2 4.2 0 0 1 4.2 4c0 5.3-7.5 10-7.5 10z"/></g>
  <g id="i-zoek"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></g>
  <g id="i-vink"><path d="M5 12.5l4.5 4.5L19 7"/></g>
  <g id="i-chevron"><path d="M8 10l4 4 4-4"/></g>
</defs></svg>

  <header class="site-header">
    <div>
      <h1 class="grote-titel">In de winkel</h1>
      <p class="ondertitel" id="samenvatting">Kies een recept</p>
    </div>
  </header>

  <main class="container">
    <div class="search-bar">
      <label class="zoekveld">
        <svg class="ic klein" viewBox="0 0 24 24"><use href="#i-zoek"/></svg>
        <input type="search" id="zoekbalk" placeholder="Zoek een recept" autocomplete="off">
      </label>
    </div>

    <div class="winkel-recent" id="recent"></div>
    <div id="lijst"></div>
  </main>

  <nav class="tabbalk" aria-label="Hoofdnavigatie">
    <a class="tab" href="./index.html">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-boek"/></svg><em>Recepten</em></a>
    <a class="tab" href="./winkel.html" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-mand"/></svg><em>Winkel</em></a>
    <a class="tab" href="./index.html?favoriet=1">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-hart"/></svg><em>Favorieten</em></a>
  </nav>

  <script src="./js/gedeeld.js?v=311950"></script>
  <script src="./js/ingredient-icoon.js?v=311950"></script>
  <script>
    /* De winkelweergave beantwoordt één vraag: ik sta hier en wil dit maken,
       wat moet ik hebben? Daarom op schapvolgorde en niet op receptvolgorde. */

    const GEKOCHT = 'gekocht';          // per recept, los van de kookvinkjes
    const LAATSTE = 'winkel_laatste';   // oud, nog voor de migratie
    const GEKOZEN = 'winkel_gekozen';

    // Schappen in de volgorde waarin je een AH doorloopt
    const SCHAPVOLGORDE = [
      'Groente, aardappelen', 'Fruit, verse sappen', 'Bakkerij', 'Kaas',
      'Vleeswaren', 'Vis', 'Vlees, kip', 'Zuivel, eieren',
      'Vegetarisch, vegan en plantaardig', 'Pasta, rijst, wereldkeuken',
      'Soepen, sauzen, kruiden, olie', 'Ontbijtgranen, beleg', 'Diepvries',
      'Borrel, chips, snacks', 'Frisdrank, sappen, water', 'Koffie, thee',
      'Bier, wijn, aperitieven',
    ];

    /* Wat je standaard in huis hebt. Het is een aanname, dus het groepje is in
       te klappen.

       De test gaat over de hele naam, niet over losse woorden. Dat was de bug:
       met losse woorden valt 'bloemkool' onder bloem en 'waterkers' onder water,
       en dan verdween bij Hele geroosterde bloemkool juist het hoofdingrediënt
       onder "heb je waarschijnlijk al". Een rode peper hoort er ook niet bij —
       alleen gemalen peper staat in het rek, een verse peper koop je. */
    const VOORRAADKAST = new Set([
      'zout', 'zeezout', 'zeezoutvlokken', 'zeezout vlokken', 'keukenzout',
      'peper', 'peperkorrels', 'peper en zout', 'zout en peper',
      'olie', 'olijfolie', 'zonnebloemolie', 'sesamolie', 'chili olie',
      'boter', 'roomboter',
      'water', 'kookwater', 'pasta kookwater',
      'suiker', 'kristalsuiker', 'basterdsuiker',
      'bloem',
      'azijn', 'rijstazijn', 'wittewijnazijn', 'balsamicoazijn',
    ]);

    // Bepalingen die het product zelf niet veranderen: zwarte peper is peper.
    const BEPALING = /\b(extra|vierge|vergine|goede|van goede kwaliteit|versgemalen|gemalen|grof|grove|fijne|fijn|witte|wit|zwarte|ongezouten|plantaardige|koude|lauw|naar smaak|snufje|voor \w+)\b/g;

    const KAST_OPEN = 'winkel_kast_open';
    function kastStaatOpen() {
      try { return localStorage.getItem(KAST_OPEN) === '1'; } catch { return false; }
    }

    let recepten = [], producten = {}, gekozen = [], zoekterm = '';
    let teHalen = [];                   // wat er nu op de lijst staat

    function isVoorraad(naam) {
      const kern = naam.toLowerCase()
        .replace(/\(.*?\)/g, ' ')   // (voor de dressing), (type 00)
        .split(',')[0]               // ', in blokjes'
        .split(' of ')[0]            // 'boter of olijfolie'
        .replace(BEPALING, ' ')
        .replace(/\s+/g, ' ').trim();
      return VOORRAADKAST.has(kern);
    }

    function gekochtVoor(id) {
      try { return JSON.parse(localStorage.getItem(GEKOCHT) || '{}')[id] || []; }
      catch { return []; }
    }
    function wisselGekocht(id, sleutel) {
      let alles = {};
      try { alles = JSON.parse(localStorage.getItem(GEKOCHT) || '{}'); } catch {}
      const lijst = alles[id] || [];
      const i = lijst.indexOf(sleutel);
      if (i === -1) lijst.push(sleutel); else lijst.splice(i, 1);
      alles[id] = lijst;
      localStorage.setItem(GEKOCHT, JSON.stringify(alles));
      return i === -1;
    }

    /* Je kookt vier porties voor twee dagen, dus één winkelbezoek dekt meestal
       meer dan één maaltijd. De lijst gaat daarom over alle recepten die je
       aantikt tegelijk. Dat scheelt nauwelijks regels — de overlap zit vooral
       in de voorraadkast — maar het zet alles in één schapvolgorde. Per recept
       apart loop je drie keer langs de groente. */
    function geselecteerd() {
      return gekozen.map(id => recepten.find(r => r.id === id)).filter(Boolean);
    }

    function bewaarKeuze() {
      try { localStorage.setItem(GEKOZEN, JSON.stringify(gekozen)); } catch {}
    }

    function wisselRecept(id) {
      const i = gekozen.indexOf(id);
      if (i === -1) gekozen.push(id); else gekozen.splice(i, 1);
      bewaarKeuze();
      renderRecent();
      renderLijst();
    }

    function renderRecent() {
      const el = document.getElementById('recent');
      let lijst = [...recepten];
      if (zoekterm) {
        const t = zoekterm.toLowerCase();
        lijst = lijst.filter(r => r.titel.toLowerCase().includes(t));
      } else {
        lijst.sort((a, b) => aantalGemaakt(b.id) - aantalGemaakt(a.id)
                          || (b.datum_toegevoegd || '').localeCompare(a.datum_toegevoegd || ''));
        lijst = lijst.slice(0, 12);
        // Wat je gekozen hebt staat vooraan, ook als het buiten de eerste twaalf
        // valt — anders verdwijnt je eigen keuze uit beeld.
        const extra = geselecteerd().filter(r => !lijst.includes(r));
        lijst = [...extra, ...lijst];
      }
      el.innerHTML = lijst.map(r => `
        <button class="winkel-rk" type="button" data-id="${r.id}"
                aria-pressed="${gekozen.includes(r.id)}">
          ${r.afbeelding
            ? `<img src="${r.afbeelding.startsWith('http') ? r.afbeelding
                 : r.afbeelding.replace('img/recept/', 'img/kaart/')}" alt="" loading="lazy"
                 onerror="this.onerror=null;this.src='${r.afbeelding}'">`
            : `<div class="winkel-rk__leeg">${r.titel.trim()[0] || '?'}</div>`}
          <span>${r.titel}</span>
        </button>`).join('');
      el.querySelectorAll('.winkel-rk').forEach(k =>
        k.addEventListener('click', () => wisselRecept(k.dataset.id)));
    }

    /* Hetzelfde als op de receptpagina: je kookt voor twee dagen, dus vier
       porties. Zo klopt de boodschappenlijst met wat je straks opschept. */
    const STANDAARD_PORTIES = 4;

    function portiesVoor(r) {
      const vasteVorm = (r.benodigdheden || [])
        .some(b => /springvorm|bakvorm|taartvorm|pizzasteen/i.test(b));
      const eigen = parseInt(localStorage.getItem(`porties_${r.id}`) || '', 10);
      if (Number.isFinite(eigen) && eigen > 0) return eigen;
      return vasteVorm ? r.porties : STANDAARD_PORTIES;
    }

    /* Alles afvinken in de winkel werkt, maar soms wil je de lijst gewoon
       meesturen. Dit stuurt alleen wat nog openstaat naar Herinneringen, via
       dezelfde Apple Shortcut als op de receptpagina. In het AH-mandje leggen
       kan niet: daar is een token uit je eigen inlog voor nodig, en dat heeft
       een site zonder server niet. Daarom is de productnaam wel een link naar
       dat exacte product, zodat je in de AH-app alleen nog op plus hoeft. */
    const SHORTCUT_NAAM = 'Boodschappen';

    async function naarHerinneringen() {
      const gekochtPer = {};
      geselecteerd().forEach(r => { gekochtPer[r.id] = gekochtVoor(r.id); });
      const isAf = (sleutel) => {
        const [id, n] = sleutel.split('|');
        return (gekochtPer[id] || []).includes(n);
      };
      // Precies wat er op het scherm staat, samengevoegd en al: anders stuur je
      // olijfolie drie keer apart naar je lijst.
      const open = teHalen
        .filter(x => !x.sleutels.every(isAf))
        .map(x => {
          const hoev = x.ing.eenheid === 'naar smaak' || !x.aantal
            ? ''
            : `${formatHoeveelheid(x.aantal, 1, 1, x.ing.eenheid)} ${x.ing.eenheid === 'stuks' ? '' : x.ing.eenheid}`.trim();
          return `${hoev} ${x.ing.naam.split('(')[0].trim()}`.trim();
        });
      if (!open.length) { melding('Alles al afgevinkt'); return; }

      const tekst = open.join('\n');
      try { await navigator.clipboard.writeText(tekst); } catch {}
      window.location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAAM)}`
        + `&input=text&text=${encodeURIComponent(tekst)}`;
      melding(`${open.length} naar je boodschappenlijst`);
    }

    function melding(tekst) {
      let el = document.getElementById('winkel-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'winkel-toast';
        el.className = 'boodschappen-toast';
        document.body.appendChild(el);
      }
      el.textContent = tekst;
      el.classList.add('zichtbaar');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('zichtbaar'), 3200);
    }

    function renderLijst() {
      const el = document.getElementById('lijst');
      const kies = geselecteerd();
      if (!kies.length) {
        el.innerHTML = `<div class="empty-state">Tik hierboven aan wat je gaat maken.
          Je kunt meer dan één recept kiezen; alles komt dan op één lijst in schapvolgorde.</div>`;
        document.getElementById('samenvatting').textContent = 'Kies een recept';
        teHalen = [];
        return;
      }

      // Afgevinkt blijft per recept bewaard, zodat het nog klopt als je er later
      // een recept bij zet of af haalt.
      const gekochtPer = {};
      kies.forEach(r => { gekochtPer[r.id] = gekochtVoor(r.id); });
      const isAf = (sleutel) => {
        const [id, n] = sleutel.split('|');
        return (gekochtPer[id] || []).includes(n);
      };

      const ruw = [], kast = [];
      kies.forEach(r => {
        // Eerst schalen, dan optellen. Twee recepten kunnen een verschillend
        // aantal porties als basis hebben; achteraf schalen klopt dan niet.
        const factor = portiesVoor(r) / (r.porties || 1);
        r.ingredienten.forEach((ing, i) => {
          const x = { ing, sleutel: `${r.id}|${i}`, aantal: (ing.hoeveelheid || 0) * factor };
          (isVoorraad(ing.naam) ? kast : ruw).push(x);
        });
      });

      // Olijfolie voor de groenten en olijfolie voor de dressing zijn in de
      // winkel één fles — en dat geldt net zo goed over recepten heen. Zelfde
      // product en zelfde eenheid gaan samen op één regel met de hoeveelheden
      // opgeteld; afvinken vinkt ze allemaal af.
      const voegSamen = (lijst) => {
        const samen = new Map();
        lijst.forEach(x => {
          const sleutel = `${x.ing.ah || x.ing.naam.toLowerCase()}|${x.ing.eenheid}`;
          const bestaand = samen.get(sleutel);
          if (bestaand) {
            bestaand.aantal += x.aantal;
            bestaand.ing = { ...bestaand.ing, naam: bestaand.ing.naam.split('(')[0].trim() };
            bestaand.sleutels.push(x.sleutel);
          } else {
            samen.set(sleutel, { ing: x.ing, aantal: x.aantal, sleutels: [x.sleutel] });
          }
        });
        return [...samen.values()];
      };
      const nodig = voegSamen(ruw);
      const kastSamen = voegSamen(kast);
      const kastOpen = kastStaatOpen();
      teHalen = nodig;

      // Groeperen op het schap waar AH het product heeft staan
      const groepen = new Map();
      nodig.forEach(x => {
        const p = x.ing.ah ? producten[x.ing.ah] : null;
        const schap = (p && p.schap) || 'Overig';
        if (!groepen.has(schap)) groepen.set(schap, []);
        groepen.get(schap).push({ ...x, p });
      });
      const gesorteerd = [...groepen.entries()].sort((a, b) => {
        const ia = SCHAPVOLGORDE.indexOf(a[0]), ib = SCHAPVOLGORDE.indexOf(b[0]);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });

      const open = nodig.filter(x => !x.sleutels.every(isAf)).length;
      document.getElementById('samenvatting').textContent = kies.length === 1
        ? `${kies[0].titel} · ${portiesVoor(kies[0])} porties · ${open} te halen`
        : `${kies.length} recepten · ${open} te halen`;

      // Vinkjes van een vorige keer blijven anders staan, en dan loop je de
      // winkel uit zonder de spullen die je toen al had afgestreept.
      const kanAf = kies.reduce((n, r) => n + (gekochtPer[r.id] || []).length, 0);

      const regel = ({ ing, aantal, sleutels, p }) => {
        const aan = sleutels.every(isAf);
        const pakken = p ? aantalVerpakkingen(aantal, ing.eenheid, p.eenheid) : null;
        // De AH-naam is het woord waar je in het schap naar zoekt: 'kerstomaten'
        // heten daar 'cherrytomaten', 'lente-uitjes' heten 'bosui'. Die naam mag
        // dus nooit wegvallen — ook niet als je meer dan één pak nodig hebt.
        // "geen AH-product gevonden" laten we weg: dat zegt de klant niets, en
        // het icoontje maakt al duidelijk waar het om gaat.
        const onder = p
          ? `<span class="ingredient-ah${pakken && pakken > 1 ? ' let' : ''}">${
              p.url
                ? `<a class="ah-link" href="${p.url}" target="_blank" rel="noopener">${p.titel}</a>`
                : p.titel}${
              pakken && pakken > 1
                ? ` · ${pakken} pakken van ${p.eenheid}`
                : (p.eenheid ? ' · ' + p.eenheid : '')}</span>`
          : '';
        const foto = ingredientVakje(ing.naam, p);
        // De hoeveelheid is hierboven al naar porties omgerekend, dus hier
        // alleen nog netjes afronden.
        const hoev = ing.eenheid === 'naar smaak' || !aantal
          ? 'naar smaak'
          : `${formatHoeveelheid(aantal, 1, 1, ing.eenheid)} ${ing.eenheid === 'stuks' ? '' : ing.eenheid}`.trim();
        return `<li class="${aan ? 'ing--gedaan' : ''}">
          <button class="vink" data-s="${sleutels.join(';')}" aria-pressed="${aan}" aria-label="Gekocht">
            <svg viewBox="0 0 24 24"><use href="#i-vink"/></svg></button>
          ${foto}
          <span class="ingredient-naam">${metHoofdletter(ing.naam)}${onder}</span>
          <span class="ingredient-hoeveelheid">${hoev}</span></li>`;
      };

      el.innerHTML = (kies.length > 1 ? `
        <button class="inklap" id="leeg-knop" style="margin-top:0;margin-bottom:.4rem">
          <span>${kies.length} recepten op de lijst</span>
          <span style="color:var(--inkt);font-weight:600">Leegmaken</span>
        </button>` : '')
        + (kanAf ? `
        <button class="inklap" id="reset-knop" style="margin-top:0;margin-bottom:.4rem">
          <span>${kanAf} afgevinkt van de vorige keer</span>
          <span style="color:var(--inkt);font-weight:600">Opnieuw beginnen</span>
        </button>` : '')
        + gesorteerd.map(([schap, items]) => `
        <div class="groepkop">${schap}</div>
        <ul class="ingredienten-lijst">${items.map(regel).join('')}</ul>`).join('')
        + (kast.length ? `
        <button class="inklap" id="kast-knop" aria-expanded="${kastOpen}">
          <span>Heb je waarschijnlijk al — ${kastSamen.length}</span>
          <svg class="ic klein" viewBox="0 0 24 24"><use href="#i-chevron"/></svg>
        </button>
        <ul class="ingredienten-lijst" id="kast-lijst"${kastOpen ? '' : ' hidden'}>
          ${kastSamen.map(x => regel({ ...x, p: x.ing.ah ? producten[x.ing.ah] : null })).join('')}
        </ul>` : '')
        // De knop sluit de lijst af, dus die hoort onderaan. Het kastgroepje
        // stond eronder en daardoor zag je het niet: je was al klaar.
        + (nodig.length ? `
        <button class="boodschappen-btn" id="stuur-btn">Zet wat nog open staat op de boodschappenlijst</button>` : '');

      el.querySelectorAll('.vink').forEach(k => k.addEventListener('click', () => {
        const naarAan = k.getAttribute('aria-pressed') !== 'true';
        k.dataset.s.split(';').forEach(sleutel => {
          const [id, n] = sleutel.split('|');
          if (gekochtVoor(id).includes(n) !== naarAan) wisselGekocht(id, n);
        });
        renderLijst();
      }));
      const stuur = document.getElementById('stuur-btn');
      if (stuur) stuur.addEventListener('click', naarHerinneringen);

      const reset = document.getElementById('reset-knop');
      if (reset) reset.addEventListener('click', () => {
        let alles = {};
        try { alles = JSON.parse(localStorage.getItem(GEKOCHT) || '{}'); } catch {}
        kies.forEach(r => delete alles[r.id]);
        localStorage.setItem(GEKOCHT, JSON.stringify(alles));
        renderLijst();
      });

      // Je keuze blijft staan tot je hem weghaalt, anders ben je hem kwijt zodra
      // je de app sluit. Maar volgende week wil je blanco beginnen.
      const leeg = document.getElementById('leeg-knop');
      if (leeg) leeg.addEventListener('click', () => {
        gekozen = [];
        bewaarKeuze();
        renderRecent();
        renderLijst();
      });

      const knop = document.getElementById('kast-knop');
      if (knop) knop.addEventListener('click', () => {
        const l = document.getElementById('kast-lijst');
        l.hidden = !l.hidden;
        knop.setAttribute('aria-expanded', String(!l.hidden));
        // Wie hem openzet wil hem meestal bij het volgende recept ook open.
        try { localStorage.setItem(KAST_OPEN, l.hidden ? '0' : '1'); } catch {}
      });
    }

    async function init() {
      const [rRes, pRes] = await Promise.all([
        fetch('./data/recepten.json', { cache: 'no-cache' }),
        fetch('./data/ah-producten.json', { cache: 'no-cache' }).catch(() => null),
      ]);
      recepten = (await rRes.json()).recepten;
      if (pRes && pRes.ok) producten = await pRes.json().catch(() => ({}));

      try { gekozen = JSON.parse(localStorage.getItem(GEKOZEN) || '[]'); } catch {}
      if (!Array.isArray(gekozen)) gekozen = [];
      // Wie hiernaartoe komt met ?id= wil dat recept erbij, niet in plaats van.
      const id = new URLSearchParams(location.search).get('id');
      const oudLaatste = localStorage.getItem(LAATSTE);
      if (!gekozen.length && oudLaatste) gekozen = [oudLaatste];
      if (id && !gekozen.includes(id)) gekozen.push(id);
      gekozen = gekozen.filter(x => recepten.some(r => r.id === x));
      bewaarKeuze();

      renderRecent();
      renderLijst();
    }

    document.getElementById('zoekbalk').addEventListener('input', e => {
      zoekterm = e.target.value.trim();
      renderRecent();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    init();
  </script>
</body>
</html>
